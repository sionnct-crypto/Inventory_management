    return findInventory(name).map(function(i){
      return i.kind==="food"
        ? {id:i.id, kind:"food", label:i.name, sub:(i.expiry ? fmt(i.expiry)+"まで・" : "期限なし・")+i.qty}
        : {id:i.id, kind:"good", label:i.name, sub:i.qty};
    });
  }
  // 消費確認カードで実際に消費できる上限数量(在庫を超えて消費できないようにするため)。
  // FEFO自動選択(複数ロットを賞味期限順に使う)なら在庫の合計、個別のロットを選んでいるならそのロット自身の数量が上限になる
  function maxConsumeQtyFor(name, candidates, useFEFO, selectedId){
    if(!candidates || !candidates.length) return null;
    if(candidates.length>=2 && useFEFO !== false) return totalQtyFor(name);
    var cand = candidates.length>=2 ? candidates.find(function(c){ return c.id===selectedId; }) : candidates[0];
    if(!cand) return null;
    var lot = inventory.find(function(i){ return i.id===cand.id; });
    if(!lot) return null;
    var qn = parseQtyNum(lot.qty);
    return qn ? qn.num : null;
  }

  // 在庫のロット数量(例:"6個")から消費数量(例:"2個")を引く。
  // 数量未指定("1点"=丸ごと消費のつもり)・単位不一致・読み取れない場合はnullを返し、呼び出し側でロットごと削除させる
  function parseQtyNum(q){ var m = (q||"").match(/^(\d+(?:\.\d+)?)(.*)$/); return m ? {num:parseFloat(m[1]), unit:m[2]} : null; }
  // 確認カードの数量スクロール選択(ステッパー)で使う単位候補。小数刻みにする単位(kg/L)は粒度を細かくする
  var QTY_UNITS = ["点","個","本","パック","枚","袋","箱","杯","着","玉","束","房","匹","切れ","kg","g","ml","L"];
  function qtyStepFor(unit){ return (unit==="kg"||unit==="L") ? 0.1 : 1; }
  // 数量の−/+ステッパー+単位のHTML(在庫登録・消費の両方の確認カードで共用)。
  // lockUnitがtrueの場合(マスタ登録済み品目)は単位セレクトを出さず、マスタで決まっている単位を静的表示のみにする。
  // maxQtyを渡すと、それを超えて入力できないよう上限(HTML属性maxおよびdata-max)を設定する(消費が在庫を超えないようにするため)
  function qtyStepperHtml(idx, qty, lockUnit, maxQty){
    var qn = parseQtyNum(qty) || {num:1, unit:"点"};
    if(maxQty!=null && qn.num > maxQty) qn = {num:maxQty, unit:qn.unit};
    var unitFieldHtml = lockUnit
      ? '<span class="item-qty-unit-label">'+qn.unit+'</span>'
      : '<select class="confirm-qty-unit" data-idx="'+idx+'">'+
          QTY_UNITS.map(function(u){ return '<option value="'+u+'"'+(u===qn.unit?" selected":"")+'>'+u+'</option>'; }).join("")+
        '</select>';
    var maxAttr = maxQty!=null ? ' max="'+maxQty+'" data-max="'+maxQty+'"' : '';
    return '<div class="qty-stepper">'+
        '<button type="button" class="qty-dec" data-idx="'+idx+'">−</button>'+
        '<input type="number" inputmode="decimal" class="confirm-qty-num" data-idx="'+idx+'" data-unit="'+escAttr(qn.unit)+'" value="'+qn.num+'" min="0"'+maxAttr+' step="'+qtyStepFor(qn.unit)+'">'+
        '<button type="button" class="qty-inc" data-idx="'+idx+'">+</button>'+
      '</div>'+
      unitFieldHtml;
  }
  function subtractQty(lotQty, consumeQty){
    if(!consumeQty || consumeQty==="1点") return null;
    var lot = parseQtyNum(lotQty), used = parseQtyNum(consumeQty);
    if(!lot || !used || lot.unit!==used.unit) return null;
    var remain = lot.num - used.num;
    if(remain <= 0) return null;
    return (Number.isInteger(remain) ? remain : remain.toFixed(1)) + lot.unit;
  }

  // 同名ロットが複数ある食品を、賞味期限が近い順(期限なしは最後)に指定数量ぶん自動で消費する(FEFO)。
  // ロットの単位が要求単位と一致しない/読み取れない場合は、その1ロットを丸ごと消費した扱いにする
  function consumeFEFO(candidates, totalQty, totalUnit){
    var sorted = candidates.slice().sort(function(a,b){
      var ai = inventory.find(function(i){ return i.id===a.id; });
      var bi = inventory.find(function(i){ return i.id===b.id; });
      var at = (ai && ai.expiry) ? ai.expiry.getTime() : Infinity;
      var bt = (bi && bi.expiry) ? bi.expiry.getTime() : Infinity;
      return at - bt;
    });
    var remaining = totalQty;
    sorted.forEach(function(c){
      if(remaining <= 0) return;
      var lot = inventory.find(function(i){ return i.id===c.id; });
      if(!lot) return;
      var lotQ = parseQtyNum(lot.qty);
      if(!lotQ || lotQ.unit !== totalUnit){
        inventory = inventory.filter(function(i){ return i.id!==lot.id; });
        remaining -= 1;
        return;
      }
      if(lotQ.num <= remaining){
        remaining -= lotQ.num;
        inventory = inventory.filter(function(i){ return i.id!==lot.id; });
      } else {
        var left = Math.round((lotQ.num - remaining)*100)/100;
        lot.qty = left + lotQ.unit;
        remaining = 0;
      }
    });
  }

  // ---------- command parsing (real free text, not canned) ----------
  function stripPunct(s){ return s.replace(/[。.!!??]+$/,"").trim(); }

  // 「牛乳1つ」「卵2個」のような個数付き表現を分解する
  // 全角数字・漢数字・和語数詞(ひとつ、ふたつ…)もASCII数字と同様に扱う
  var KANJI_NUM = {"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9,"十":10};
  var NATIVE_COUNT = {"ひとつ":1,"ふたつ":2,"みっつ":3,"よっつ":4,"いつつ":5,"むっつ":6,"ななつ":7,"やっつ":8,"ここのつ":9,"とお":10};
  // 個数系の助数詞(そのまま表示に使う)
  var COUNTER_LIST = ["つ","個","本","パック","枚","袋","杯","着","玉","束","房","匹","切れ"];
  // 重さ・体積の単位(表記ゆれをkg/g/mg/L/mlに正規化する)
  var WEIGHT_UNIT_ALIASES = {"キログラム":"kg","キロ":"kg","グラム":"g","ミリグラム":"mg","ミリリットル":"ml","シーシー":"ml","リットル":"L"};
  var WEIGHT_UNIT_LATIN = ["kg","mg","ml","cc","g","l"]; // 大文字/全角は事前にtoHalfWidthで正規化済み、比較は小文字化して行う
  var UNIT_TOKENS = Object.keys(WEIGHT_UNIT_ALIASES).concat(WEIGHT_UNIT_LATIN, COUNTER_LIST)
    .sort(function(a,b){ return b.length - a.length; });
  var UNIT_RE = "(" + UNIT_TOKENS.join("|") + ")";
  function normalizeUnit(u){
    if(!u) return null;
    if(WEIGHT_UNIT_ALIASES[u]) return WEIGHT_UNIT_ALIASES[u];
    var lower = u.toLowerCase();
    if(WEIGHT_UNIT_LATIN.indexOf(lower)!==-1){
      if(lower==="l") return "L";
      if(lower==="cc") return "ml";
      return lower;
    }
    return u; // 個数系の助数詞はそのまま
  }
  function toHalfWidth(s){
    // 全角英数記号(U+FF01-FF5E)を半角に正規化(全角数字・全角ｋｇ等のIME変換ゆれに対応)
    return s.replace(/[！-～]/g, function(ch){ return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0); });
  }
  // 数量を切り出した残りに「牛乳を」のような助詞が残ってしまうのを取り除く
  // (例: 「牛乳を1つ」→数量抽出後に名前が「牛乳を」になるのを「牛乳」に補正)
  function stripTrailingParticle(name){
    return name.replace(/(を|が|は|の)$/, "").trim();
  }
  function stripQty(rawS){
    var s = toHalfWidth(rawS.trim());

    // 1) 和語数詞が末尾に付いている場合(例: 「牛乳ひとつ」)
    var nativeKeys = Object.keys(NATIVE_COUNT).sort(function(a,b){ return b.length-a.length; });
    for(var i=0;i<nativeKeys.length;i++){
      var k = nativeKeys[i];
      if(s.length > k.length && s.slice(-k.length) === k){
        return {name: stripTrailingParticle(s.slice(0, -k.length).trim()), qty: NATIVE_COUNT[k] + "つ"};
      }
    }

    // 2) 漢数字+単位(例: 「牛乳一つ」「卵二個」「米五キロ」)
    var m = s.match(new RegExp("^(.+?)\\s*([一二三四五六七八九十])\\s*"+UNIT_RE+"?$", "i"));
    if(m && m[1]) return {name:stripTrailingParticle(m[1].trim()), qty: KANJI_NUM[m[2]] + (normalizeUnit(m[3])||"点")};

    // 3) 算用数字(小数可・全角は上でtoHalfWidthにより正規化済み)+単位(例: 「牛乳1つ」「卵2個」「米5kg」「牛乳500ml」)
    m = s.match(new RegExp("^(.+?)\\s*(\\d+(?:\\.\\d+)?)\\s*"+UNIT_RE+"?$", "i"));
    if(m && m[1]) return {name:stripTrailingParticle(m[1].trim()), qty: m[2] + (normalizeUnit(m[3])||"点")};

    return {name:stripTrailingParticle(s), qty:"1点"};
  }
  // ---------- 認識精度の補正: 既知の品目名に寄せるあいまい一致 ----------
  function levenshtein(a,b){
    var m=a.length, n=b.length, dp=[], i, j;
    for(i=0;i<=m;i++){ dp.push([i]); }
    for(j=0;j<=n;j++){ dp[0][j]=j; }
    for(i=1;i<=m;i++){
      for(j=1;j<=n;j++){
        dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
      }
    }
    return dp[m][n];
  }
  function knownVocab(){
    var set = {};
    inventory.forEach(function(i){ set[i.name]=true; });
    shopping.forEach(function(s){ set[s.name]=true; });
    // マスタ登録済みの品目名も、あいまい一致による聞き取り補正の対象に含める
    // (在庫・買い物リストが空の状態でもマスタにある品目は正しく認識できるようにするため)
    masterList.forEach(function(m){ set[m.name]=true; });
    Object.keys(EMOJI).forEach(function(k){ set[k]=true; });
    Object.keys(SHELF_LIFE).forEach(function(k){ set[k]=true; });
    return Object.keys(set);
  }
  // 聞き取り結果が完全一致しなくても、既知の品目名に近ければそちらに寄せる
  // (例: 聞き取りが「鶏もも肉」を「鶏もも人」と誤認識しても「鶏もも肉」に補正)
  function snapToVocab(name){
    if(!name) return name;
    var vocab = knownVocab(), best=null, bestDist=Infinity, tie=false;
    vocab.forEach(function(v){
      var d = levenshtein(name, v);
      var threshold = v.length<=2 ? 0 : (v.length<=4 ? 1 : 2);
      if(d>threshold) return;
      if(d<bestDist){ bestDist=d; best=v; tie=false; }
      else if(d===bestDist && v!==best){ tie=true; }
    });
    // マスタ品目が1000件超に増え、「赤ワイン/白ワイン」「鶏もも肉/鶏むね肉」のように編集距離が近い品目名が
    // 大量に存在するようになったため、同じ距離で複数の候補が並ぶ(=どれに寄せるべきか決められない)場合は
    // 誤補正のリスクの方が高いと判断し、あえて補正せず聞き取ったままの文字列を使う
    // (完全一致(d=0)はknownVocab()が重複のないユニークな名前の集合を返すため常に候補が1つに定まり、ここでは影響しない)
    if(tie) return name;
    return best || name;
  }
  // 音声認識でよく出る言い回しのゆれを、コマンド判定できる形に正規化する
  // 在庫登録のキーワード: 買った/購入した/買いました/買ってきた/買って来た/追加した/追加/加えた/入れた/ゲットした/もらった/仕入れた
  // 在庫消費のキーワード: 使い切った/使い終わった/使い終えた/なくなりました/切らした/使った/削除/消費した/食べた/飲んだ/なくした/捨てた
  // 買い物リスト追加のキーワード: 欲しい/ほしい/買いたい/買っておきたい/買っておこう/足りない/切れそう/ストックがない/在庫がない/不足してる/不足している
  // (長い言い回しほど正規表現の前方に置き、部分一致で食われて末尾が残ってしまうのを防いでいる)
  function normalizeSpeech(text){
    return text
      .replace(/購入した|買いました|買ってきた|買って来た|追加した|加えた|入れた|ゲットした|もらった|仕入れた|追加/g, "買った")
      .replace(/使い終わった|使い終えた|なくなりました|切らした|消費した|なくした|食べた|飲んだ|捨てた|削除|使った/g, "使い切った")
      .replace(/欲しいな|欲しいです|ほしいな|ほしいです|欲しい|買いたい|買っておきたい|買っておこう|足りない|切れそう|ストックがない|在庫がない|不足している|不足してる/g, "ほしい")
      .replace(/えーと|えっと|あの、|あのー/g, "")
      .trim();
  }

  // 「牛乳とヨーグルト」「牛乳、卵」のような複数品目を分解する
  function splitItems(s){
    return s.split(/と|、|,|,/).map(function(p){ return p.trim(); }).filter(Boolean).map(stripQty).map(function(it){
      var name = snapToVocab(it.name);
      var qty = it.qty;
      var qn = parseQtyNum(qty);
      // 発話内で数量・単位が言われなかった場合(stripQtyが「1点」を返した場合)、
      // または「3つ」のように単位が汎用の和語助数詞「つ」だった場合は、
      // マスタに登録済みの単位があればそちらに差し替える(例: 「米買った」→「1kg」、「牛乳3つ買った」→「3本」)。
      // 「つ」はアプリの単位一覧(QTY_UNITS)には存在しない話し言葉的な助数詞のため、常に置き換え対象とする
      if(qty === "1点" || (qn && qn.unit === "つ")){
        qty = (qn ? qn.num : 1) + defaultUnitFor(name);
      }
      return {name: name, qty: qty};
    });
  }

  function parseCommand(raw){
    var text = stripPunct(normalizeSpeech(raw.replace(/、/g,"、").trim()));
    if(!text) return null;

    // 1) 「XXX、<日付>まで」 or 「XXX <日付>まで」(複数品目に同じ日付を適用)
    // 「まで買った」のように賞味期限を言ってから買ったと続ける言い方にも対応
    var m = text.match(/^(.+?)[、\s]+(.+?)まで(?:買った)?$/);
    if(m){
      var d = parseDatePhrase(m[2].trim());
      if(d) return {type:"register", items:splitItems(m[1]), expiry:d};
    }

    // 2) 「XXX買った」(複数品目可)
    m = text.match(/^(.+?)(?:を)?買った$/);
    if(m) return {type:"bought", items:splitItems(m[1])};

    // 3) 「XXX使い切った/なくなった/切れた」(複数品目可)
    m = text.match(/^(.+?)(?:が)?(使い切った|なくなった|切れた)$/);
    if(m) return {type:"depleted", items:splitItems(m[1])};

    // 4) 「冷蔵庫に何入ってる?」等の在庫サマリ
    if(/何(が)?(入って|ある)/.test(text) || /在庫(は|教えて)/.test(text)) return {type:"summary"};

    // 5) 「今日何作ろう」「レシピ」「献立」
    if(/何(を)?作ろう/.test(text) || /レシピ/.test(text) || /献立/.test(text)) return {type:"recipe"};

    // 6) 「XXXまだある?」「XXXある?」(在庫確認は1品目のみ対応)
    m = text.match(/^(.+?)(?:はまだ|まだ|は)?ある[?？]?$/);
    if(m) return {type:"check", item:snapToVocab(stripQty(m[1]).name)};

    // 7) 「XXX欲しい/ほしい」等、買い物リストに入れたい旨の明示的な発話(複数品目可)
    m = text.match(/^(.+?)(?:が|は)?ほしい$/);
    if(m) return {type:"wantbuy", items:splitItems(m[1])};

    // fallback: 単語だけなら買い物リストに追加(複数品目可)
    return {type:"unknown", items:splitItems(text)};
  }

  function estimateShelfLife(name){ var m = findMaster(name); if(m && m.kind==="food" && m.needsExpiry) return m.shelfLifeDays; return SHELF_LIFE[name] || 7; }
  function emojiFor(name){ var m = findMaster(name); if(m && m.emoji) return m.emoji; return EMOJI[name] || "📦"; }

  function speakAloud(text){
    if(!speakOn) return;
    try{
      if(!("speechSynthesis" in window)) return;
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "ja-JP"; u.rate = 1.02;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  // ---------- 自動音声入力(ボタンを押したらその場で聞き取り開始) ----------
  var SRImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
  var micSupported = !!(SRImpl && window.isSecureContext);
  var recognition = null, listening = false;
  if(micSupported){
    recognition = new SRImpl();
    recognition.lang = "ja-JP";
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 4;

    recognition.onresult = function(event){
      var res = event.results[event.results.length-1];
      var text = pickBestAlternative(res);
      var cap = document.getElementById("micCaption");
      if(cap) cap.innerHTML = "聞き取り中: <b>"+text+"</b>";
      if(res.isFinal){
        stopListeningUI();
        if(text) runCommand(text);
      }
    };
    recognition.onerror = function(e){
      stopListeningUI();
      var messages = {
        "not-allowed":"マイクの使用が許可されていないみたい。設定でこのサイトのマイクを許可してね。",
        "service-not-allowed":"マイクの使用が許可されていないみたい。設定でこのサイトのマイクを許可してね。",
        "no-speech":"聞き取れなかった、もう一度試して。",
        "audio-capture":"マイクが見つからなかった。",
        "network":"通信状態が原因で音声認識できなかった。文字入力に切り替えるね。"
      };
      var msg = messages[e.error] || "音声認識でエラーが起きた。文字入力に切り替えるね。";
      chatLog.push({who:"app", text: msg});
      saveState();
      if(activeTab==="voice") renderVoice();
      var input = document.getElementById("voiceInput");
      if(input) input.focus();
    };
    recognition.onend = function(){ stopListeningUI(); };
  }

  // 候補(alternatives)の中から、既知の品目名を一番多く含むものを選ぶ
  // (認識エンジンの第1候補が必ずしも正しいとは限らないため)
  function pickBestAlternative(result){
    var vocab = knownVocab();
    var best = result[0] ? result[0].transcript : "";
    var bestScore = -1;
    for(var i=0;i<result.length;i++){
      var t = result[i].transcript;
      // 単純に「含まれる語の数」を数えると、マスタが1000件を超えて「肉」「水」のような短い汎用的な
      // 部分文字列まで大量にヒットするようになり、スコアがノイズだらけになって本来選ぶべき候補を
      // 選べなくなるため、マッチした語の文字数を足し合わせて重み付けする
      // (より具体的で長い品目名に一致した候補ほど高スコアになり、短い偶然の部分一致の影響を受けにくくする)
      var score = vocab.reduce(function(s,v){ return s + (t.indexOf(v)!==-1 ? v.length : 0); }, 0);
      if(score > bestScore){ bestScore = score; best = t; }
    }
    return best;
  }

  function stopListeningUI(){
    listening = false;
    var btn = document.getElementById("micBtn");
    if(btn) btn.classList.remove("listening");
  }

  function toggleListening(){
    if(!recognition) return;
    if(listening){ recognition.stop(); return; }
    listening = true;
    var btn = document.getElementById("micBtn");
    if(btn) btn.classList.add("listening");
    var cap = document.getElementById("micCaption");
    if(cap) cap.textContent = "聞いています…";
    try{ recognition.start(); }
    catch(e){
      // recognition.start()が同期的に例外を投げるとボタンの赤点滅・「聞いています…」表示が
      // 一瞬で元に戻り、ユーザーからは「押しても何も起きない」ように見えてしまう(実際にiOS Safari等では
      // マイク許可はあってもここで失敗することがある)。エラーメッセージを出して気づけるようにする
      stopListeningUI();
      if(cap) cap.textContent = "タップして話しかけて";
      var startErrMsg = "この端末では自動音声入力を開始できなかった。文字欄をタップしてキーボードのマイクを使うか、文字で入力してね。";
      chatLog.push({who:"app", text: startErrMsg});
      saveState();
      if(activeTab==="voice") renderVoice();
    }
  }

  function runCommand(raw){
    // 確認カード/分割編集カードが出ている間は新しい発話を解析しない(登録/キャンセルを選ぶまでブロック)
    if(pendingConfirm || pendingSplit){
      chatLog.push({who:"user", text: raw});
      chatLog.push({who:"app", text:"まず今の確認を終えてね。下のカードで登録かキャンセルを選んでから続けよう。"});
      persistAndRenderVoice();
      return;
    }
    chatLog.push({who:"user", text: raw});
    var cmd = parseCommand(raw);
    var reply = "";

    if(!cmd){ reply = "うまく聞き取れなかった、もう一度言ってみて。"; }
    else if(cmd.type === "bought"){
      // 賞味期限は自動見積もり。マスタで消耗品指定されている品目は在庫の種別も消耗品にする。
      // 即登録はせず、内容を確認してからOKで登録する
      var pcItemsB = cmd.items.map(function(it){
        if(masterKindFor(it.name) === "good"){
          return {itemKind:"good", name: it.name, emoji: emojiFor(it.name), qty: it.qty, registerMaster:true};
        }
        return {itemKind:"food", name: it.name, emoji: emojiFor(it.name), qty: it.qty,
          expiry: addDays(estimateShelfLife(it.name)), noExpiry: !needsExpiryDefault(it.name), registerMaster:true};
      });
      pendingConfirm = {kind:"inventory", items: pcItemsB};
      reply = pcItemsB.map(function(i){return i.name;}).join("・") + "だね。下の内容を確認してOKしてね(期限や種別は直接変えられるよ)。";
    }
    else if(cmd.type === "register"){
      // 賞味期限が明言されている場合はそれを使う。こちらも即登録はせず確認してからOKで登録する
      var pcItemsR = cmd.items.map(function(it){
        return {itemKind:"food", name: it.name, emoji: emojiFor(it.name), qty: it.qty, expiry: cmd.expiry, noExpiry:false, registerMaster:true};
      });
      pendingConfirm = {kind:"inventory", items: pcItemsR};
      reply = pcItemsR.map(function(i){return i.name;}).join("・") + "を" + fmt(cmd.expiry) + "までで登録するね。下の内容を確認してOKしてね。";
    }
    else if(cmd.type === "depleted"){
      // 在庫(食品・消耗品どちらも)から同じ/似た名前の候補を探す。複数あれば確認時に選んでもらう
      var pcItemsD = cmd.items.map(function(it){
        var candidates = buildConsumeCandidates(it.name);
        var kindGuess = candidates.length ? candidates[0].kind : masterKindFor(it.name);
        // 同名ロットが複数ある場合、初期値では(食品は賞味期限が近い順に、消耗品は登録順に)自動で消費する(useFEFO)。
        // カップ麺など順番通りに使いたくない場合はカード上のチェックを外して個別選択に切り替えられる
        var multiLot = candidates.length>=2;
        var selectedId = (!multiLot && candidates.length===1) ? candidates[0].id : null;
        var useFEFO = multiLot;
        // 発話で指定された消費量が実際の在庫を超えていたら、在庫の範囲内にクランプする(在庫以上は消費できない)
        var qty = it.qty;
        var maxQty = maxConsumeQtyFor(it.name, candidates, useFEFO, selectedId);
        if(maxQty!=null){
          var qn = parseQtyNum(qty);
          if(qn && qn.num > maxQty) qty = maxQty + qn.unit;
        }
        // 買い物リストへの追加の初期値: マスタに安全在庫が設定済みで、今回の使用後(現在の合計 − 消費量)の在庫が
        // それ以下になるならチェック済みにする(現在の在庫ではなく使用後の数量で判定する)。
        // 安全在庫が未設定の品目は、従来通り消耗品は初期値チェック(すぐ買い足す前提)、食品は初期値未チェックにする
        var addToShoppingDefault = willBeBelowSafetyStockAfterConsume(it.name, qty) || kindGuess !== "food";
        return {name: it.name, emoji: emojiFor(it.name), qty: qty, candidates: candidates,
          selectedId: selectedId,
          useFEFO: useFEFO, addToShopping: addToShoppingDefault};
      });
      pendingConfirm = {kind:"consume", items: pcItemsD};
      var hasMultiLot = pcItemsD.some(function(i){ return i.candidates.length>=2; });
      var msgTail = hasMultiLot
        ? "同じ名前の在庫が複数あるから、消費する数量を入力してOKしてね(自動でロットを選んで使うよ。順番通りじゃなくていい場合はチェックを外して個別に選べるよ)。"
        : "下の内容を確認してOKしてね。";
      reply = pcItemsD.map(function(i){return i.name;}).join("・") + "だね。" + msgTail;
    }
    else if(cmd.type === "summary"){
      var foods = inventory.filter(function(i){return i.kind==="food" && (!i.expiry || daysLeft(i.expiry)>=0);}).map(function(i){return i.name;});
      var warn = inventory.filter(function(i){return i.kind==="food" && i.expiry && statusOf(i.expiry)==="warn";}).map(function(i){return i.name;});
      reply = (foods.length? foods.join("、")+"が入ってるよ。":"食品の在庫は今のところ無いみたい。") + (warn.length? warn.join("・")+"はもうすぐ期限切れ。":"");
    }
    else if(cmd.type === "recipe"){
      currentRecipes = pickRecipes();
      var topRecipe = currentRecipes[0];
      reply = topRecipe.need.join("と") + "が使えるから、「" + topRecipe.name + "」はどう?他にも候補を献立タブに出しておいたよ。";
      chatLog.push({who:"app", text:reply});
      speakAloud(reply);
      persistAndRenderVoice();
      setTimeout(function(){ switchTab("recipe"); }, 500);
      return;
    }
    else if(cmd.type === "check"){
      var found = findInventory(cmd.item)[0];
      if(!found) reply = cmd.item + "は今のところ登録が無いよ。";
      else if(found.kind==="good") reply = found.name + "はまだあるよ、"+found.qty+"。";
      else if(!found.expiry) reply = "まだあるよ(賞味期限は設定していないよ)。";
      else { var st = statusOf(found.expiry); reply = st==="danger" ? found.name+"は期限切れになってるよ。" : "まだあるよ、"+statusLabel(found.expiry)+"。"; }
    }
    else if(cmd.type === "wantbuy"){
      // 「欲しい/ほしい」等、買い物リストに入れたいという明示的な発話
      var pcItemsW = cmd.items.map(function(it){ return {name: it.name, emoji: emojiFor(it.name)}; });
      pendingConfirm = {kind:"shopping", items: pcItemsW};
      reply = pcItemsW.map(function(i){return i.name;}).join("・") + "だね。下の内容を確認してOKしてね。";
    }
    else{ // unknown -> 買い物リストへの追加として扱う(複数品目可)。こちらも確認してからOKで追加する
      var pcItemsS = cmd.items.map(function(it){ return {name: it.name, emoji: emojiFor(it.name)}; });
      pendingConfirm = {kind:"shopping", items: pcItemsS};
      reply = "コマンドとしては認識できなかったから、「"+pcItemsS.map(function(i){return i.name;}).join("・")+"」を買い物リストに追加してもいい?下の内容を確認してOKしてね。";
    }

    chatLog.push({who:"app", text:reply, tag: pendingConfirm ? "登録内容を確認してね" : null});
    speakAloud(reply);
    persistAndRenderVoice();
  }

  // 声タブ操作の直後に呼ばれる。在庫タブの中身は#contentを共有しているため、
  // ここでrenderInventory()まで呼ぶと今見ている声タブの画面(確認カード含む)を
  // 問答無用で在庫タブの表示に上書きしてしまう。実際のタブ切り替え時に
  // switchTab()が最新のinventory配列から再描画するので、ここでは呼ばない。
  function persistAndRenderVoice(){ saveState(); if(activeTab==="voice") renderVoice(); }

  function resolveConfirm(yes){
    if(!pendingConfirm) return;
    var kind = pendingConfirm.kind;
    var items = pendingConfirm.items;
    var msg;
    if(!yes){
      msg = "キャンセルしたよ。";
    } else if(kind === "inventory"){
      var addedToMaster = [];
      var removedFromShopping = [];
      var skippedZero = [];
      var registeredNames = [];
      items.forEach(function(it){
        // 数量0は在庫が0ということなので登録しない(音声の数量誤認識でそのまま確定されるのを防ぐ)
        var qn0 = parseQtyNum(it.qty);
        if(qn0 && qn0.num<=0){ skippedZero.push(it.name); return; }
        registeredNames.push(it.name);
        if(it.itemKind === "good"){
          inventory.push({id:nextId(), kind:"good", name:it.name, emoji:it.emoji, qty:it.qty, registeredAt:new Date()});
        } else {
          inventory.push({id:nextId(), kind:"food", name:it.name, emoji:it.emoji, expiry: it.noExpiry ? null : it.expiry, qty:it.qty, registeredAt:new Date()});
        }
        // マスタ未登録の品目は、チェックが入っていれば今回の内容でマスタにも登録する
        if(it.registerMaster !== false && !findMaster(it.name)){
          var safetyStock = it.safetyStock!=null ? it.safetyStock : null;
          if(it.itemKind === "good"){
            masterList.push({name:it.name, emoji:it.emoji, kind:"good", safetyStock:safetyStock});
          } else {
            masterList.push({name:it.name, emoji:it.emoji, kind:"food", needsExpiry: !it.noExpiry, shelfLifeDays: it.noExpiry ? 7 : Math.max(1, daysLeft(it.expiry)), safetyStock:safetyStock});
          }
          addedToMaster.push(it.name);
        }
        // 買い物リストからの削除は在庫登録の後に行う(安全在庫との比較に購入後の合計在庫を使うため)。
        // 安全在庫が設定されている品目は、購入後の合計が安全在庫以上になった場合だけ削除し、その旨をアナウンスする
        // (少しだけ買い足しても安全在庫に届いていなければリストに残す)。安全在庫が未設定の品目は
        // 従来通り、買ったら無条件で買い物リストから消す(こちらは変更前と同じくアナウンスしない)
        var hit = shopping.find(function(s){ return s.name===it.name || it.name.indexOf(s.name)!==-1; });
        if(hit){
          var m = findMaster(it.name);
          var hasSafety = m && m.safetyStock!=null;
          var shouldRemove = hasSafety ? isAtOrAboveSafetyStock(it.name) : true;
          if(shouldRemove){
            shopping = shopping.filter(function(s){ return s.id!==hit.id; });
            if(hasSafety) removedFromShopping.push(it.name);
          }
        }
      });
      // 同名・同種別・同賞味期限・同単位のロットが既存在庫と重複していたら1件に統合する(在庫画面で二重表示にならないようにするため)
      mergeDuplicateLots();
      currentRecipes = pickRecipes();
      msg = (registeredNames.length ? registeredNames.join("・") + "を在庫に登録したよ。" : "") +
        (addedToMaster.length ? addedToMaster.join("・") + "はマスタにも登録しておいたよ。" : "") +
        (removedFromShopping.length ? removedFromShopping.join("・") + "は安全在庫を満たしたので買い物リストから消しておいたよ。" : "") +
        (skippedZero.length ? skippedZero.join("・") + "は数量が0だったので登録しなかったよ。" : "");
    } else if(kind === "shopping"){
      items.forEach(function(it){
        if(!shopping.find(function(s){return s.name===it.name;})) shopping.push({id:nextId(), name:it.name, emoji:it.emoji, done:false});
      });
      msg = items.map(function(i){return i.name;}).join("・") + "を買い物リストに追加したよ。";
    } else if(kind === "consume"){
      var addedToShopping = [];
      items.forEach(function(it){
        var isMultiLot = it.candidates.length>=2;
        if(isMultiLot && it.useFEFO !== false){
          var qn = parseQtyNum(it.qty) || {num:1, unit:"点"};
          consumeFEFO(it.candidates, qn.num, qn.unit);
        } else if(it.selectedId!=null){
          var target = inventory.find(function(i){ return i.id===it.selectedId; });
          if(target){
            // 数量指定があれば在庫から差し引く。数量未指定/単位不一致ならロットごと削除(食品・消耗品共通)
            var remain = subtractQty(target.qty, it.qty);
            if(remain === null) inventory = inventory.filter(function(i){ return i.id!==target.id; });
            else target.qty = remain;
          }
        } else if(it.candidates.length === 0){
          inventory.push({id:nextId(), kind:"good", name:it.name, emoji:it.emoji, qty:"0点", registeredAt:new Date()});
        }
        // 候補が複数あるのにどれも選ばれていない場合は、誤って新規消耗品を追加しないよう何もしない
        if(it.addToShopping !== false){
          if(!shopping.find(function(s){return s.name===it.name;})) shopping.push({id:nextId(), name:it.name, emoji:it.emoji, done:false});
          addedToShopping.push(it.name);
        }
      });
      currentRecipes = pickRecipes();
      msg = items.map(function(i){return i.name;}).join("・") + "を消費済みにしたよ。" +
        (addedToShopping.length ? addedToShopping.join("・") + "は買い物リストにも追加しておいたよ。" : "");
    }
    chatLog.push({who:"app", text:msg});
    speakAloud(msg);
    pendingConfirm = null;
    // 確認カードは声タブ以外(在庫タブの消費操作など)からも出せるため、今表示中のタブを再描画する
    saveState(); RENDER[activeTab](); updateTabLockUI();
  }

  // 確認カード/分割編集カード表示中はOK・キャンセル(登録)を選ぶまで他のタブに移動できないようにする(見た目のロック状態も反映)
  function updateTabLockUI(){
    document.querySelectorAll(".tab").forEach(function(t){
      if(t.classList.contains("disabled")) return;
      var isActive = t.getAttribute("data-tab") === activeTab;
      t.classList.toggle("locked", !!(pendingConfirm || pendingSplit) && !isActive);
    });
  }

  // アイテムをタップすると、数量・賞味期限を編集する専用カード(分割編集)を開く。
  // 確認カードと同じく1件のみ・モーダル的にブロッキングし、登録/キャンセルで確定する
  function startSplitEdit(id){
    if(pendingConfirm || pendingSplit){
      var card = document.querySelector(".confirm-card, .split-card");
      if(card) card.scrollIntoView({behavior:"smooth", block:"start"});
      return;
    }
    var item = inventory.find(function(i){ return i.id===id; });
    if(!item) return;
    var qn = parseQtyNum(item.qty) || {num:1, unit:"点"};
    pendingSplit = {
      originalId: id, kind: item.kind, name:item.name, emoji:item.emoji, unit: qn.unit, originalTotal: qn.num,
      rows: [{qty: qn.num, expiry: item.kind==="food" ? item.expiry : null}]
    };
    saveState();
    renderInventory();
    updateTabLockUI();
    scrollContentTop();
  }

  function renderSplitCard(){
    var ps = pendingSplit;
    var rowsHtml = ps.rows.map(function(r, idx){
      return '<div class="confirm-row split-row">'+
        '<div class="qty-stepper">'+
          '<button type="button" class="split-qty-dec" data-row="'+idx+'">−</button>'+
          '<input type="number" inputmode="decimal" class="split-qty-num" data-row="'+idx+'" value="'+r.qty+'" min="0" step="'+qtyStepFor(ps.unit)+'">'+
          '<button type="button" class="split-qty-inc" data-row="'+idx+'">+</button>'+
        '</div>'+
        '<span class="item-qty-unit-label">'+ps.unit+'</span>'+
        (ps.kind!=="food" ? '' : (r.expiry ? '<input type="date" class="split-date" data-row="'+idx+'" value="'+isoDate(r.expiry)+'">' : '<span class="pill noexp">期限なし</span>'))+
        (idx>0 ? '<button type="button" class="split-row-remove" data-row="'+idx+'">✕</button>' : '')+
        '</div>';
    }).join("");
    var total = Math.round(ps.rows.reduce(function(s,r){return s+r.qty;},0)*100)/100;
    var origTotal = Math.round(ps.originalTotal*100)/100;
    var warnHtml = total!==origTotal
      ? '<div class="split-warn">⚠ 合計が元の数量('+origTotal+ps.unit+')と異なります(現在の合計: '+total+ps.unit+')。このまま登録もできるよ。</div>'
      : '';
    var badgeLabel = ps.kind==="food" ? "数量・賞味期限の編集" : "数量の編集";
    return '<div class="confirm-card split-card">'+
      '<div class="title"><span class="badge">'+badgeLabel+'</span>'+ps.emoji+' '+ps.name+'</div>'+
      '<div class="confirm-list">'+rowsHtml+'</div>'+
      '<button type="button" id="splitAddRow" class="chip">+ ロットを分ける</button>'+
      warnHtml+
      '<div class="confirm-actions"><button id="splitCancel">キャンセル</button><button class="primary" id="splitOk">登録</button></div>'+
      '</div>';
  }

  function wireSplitCard(){
    if(!pendingSplit) return;
    document.querySelectorAll(".split-qty-num").forEach(function(inp){
      inp.addEventListener("change", function(){
        var row = Number(inp.getAttribute("data-row"));
        var n = parseFloat(inp.value); if(isNaN(n)||n<0) n = 0;
        pendingSplit.rows[row].qty = Math.round(n*100)/100;
        saveState(); renderInventory();
      });
    });
    document.querySelectorAll(".split-qty-dec, .split-qty-inc").forEach(function(btn){
      btn.addEventListener("click", function(){
        var row = Number(btn.getAttribute("data-row"));
        var step = qtyStepFor(pendingSplit.unit);
        var cur = pendingSplit.rows[row].qty;
        pendingSplit.rows[row].qty = Math.round((btn.classList.contains("split-qty-inc") ? cur+step : Math.max(0,cur-step))*100)/100;
        saveState(); renderInventory();
      });
    });
    document.querySelectorAll(".split-date").forEach(function(inp){
      inp.addEventListener("change", function(){
        var row = Number(inp.getAttribute("data-row"));
        if(!inp.value) return;
        pendingSplit.rows[row].expiry = parseIsoDate(inp.value);
        saveState();
      });
    });
    document.querySelectorAll(".split-row-remove").forEach(function(btn){
      btn.addEventListener("click", function(){
        var row = Number(btn.getAttribute("data-row"));
        pendingSplit.rows.splice(row,1);
        saveState(); renderInventory();
      });
    });
    var addBtn = document.getElementById("splitAddRow");
    if(addBtn) addBtn.addEventListener("click", function(){
      pendingSplit.rows.push({qty:0, expiry: pendingSplit.rows[0].expiry});
      saveState(); renderInventory();
    });
    var cancelBtn = document.getElementById("splitCancel");
    if(cancelBtn) cancelBtn.addEventListener("click", function(){
      pendingSplit = null;
      saveState(); renderInventory(); updateTabLockUI();
    });
    var okBtn = document.getElementById("splitOk");
    if(okBtn) okBtn.addEventListener("click", applySplit);
    updateTabLockUI();
  }

  // 登録: 1行目は元のロットを更新(数量0なら削除)、2行目以降は数量0を無視して新しいロットとして追加する
  function applySplit(){
    var ps = pendingSplit;
    var originalItem = inventory.find(function(i){ return i.id===ps.originalId; });
    ps.rows.forEach(function(r, idx){
      if(idx===0){
        if(!originalItem) return;
        if(r.qty <= 0) inventory = inventory.filter(function(i){ return i.id!==ps.originalId; });
        else { originalItem.qty = r.qty + ps.unit; if(ps.kind==="food") originalItem.expiry = r.expiry; }
      } else if(r.qty > 0){
        var newItem = {id:nextId(), kind:ps.kind, name:ps.name, emoji:ps.emoji, qty: r.qty+ps.unit};
        if(ps.kind==="food") newItem.expiry = r.expiry;
        // 元のロットを分けただけで新規購入ではないため、登録日は元のロットのものを引き継ぐ
        newItem.registeredAt = (originalItem && originalItem.registeredAt) ? originalItem.registeredAt : new Date();
        inventory.push(newItem);
      }
    });
    // 分割で作った新しいロットが、賞味期限の指定を変えなかった等で既存の別ロットと同じ日付になっていたら統合する
    mergeDuplicateLots();
    currentRecipes = pickRecipes();
    pendingSplit = null;
    saveState();
    renderInventory();
    updateTabLockUI();
  }

  // ---------- rendering ----------
  // 在庫タブの「殻」(タイトル・確認/分割カード・食品/消耗品切替・表示切替・バナー・検索欄・一覧の入れ物)を描画する。
  // 検索欄への1文字ごとの入力ではこの関数は呼ばない(呼ぶと検索欄自体が作り直されてフォーカスが外れ、
  // スマホではソフトキーボードが閉じたり文字が二重入力されたりする) — 検索はrenderInventoryList()だけを呼ぶ
  function renderInventory(){
    var soon = inventory.filter(function(i){return i.kind==="food" && i.expiry && (statusOf(i.expiry)==="warn"||statusOf(i.expiry)==="danger");});
    var priorityLabel = invKindFilter==="food" ? "賞味期限が近い順" : "残りが少ない順";
    var html = '<div class="screen-title"><h2>在庫</h2><span class="sub">'+(sortMode==="expiry"?priorityLabel:"名前順")+'</span></div>';
    if(pendingConfirm) html += renderConfirmCard(pendingConfirm);
    else if(pendingSplit) html += renderSplitCard();
    html += '<div class="kind-toggle">'+
      '<button type="button" class="kind-tab'+(invKindFilter==="food"?" active":"")+'" data-kind="food">🍽️ 食品</button>'+
      '<button type="button" class="kind-tab'+(invKindFilter==="good"?" active":"")+'" data-kind="good">🧻 消耗品</button>'+
      '</div>';
    html += '<div class="kind-toggle view-toggle">'+
      '<button type="button" class="kind-tab view-tab'+(invViewMode==="lots"?" active":"")+'" data-view="lots">ロット別</button>'+
      '<button type="button" class="kind-tab view-tab'+(invViewMode==="summary"?" active":"")+'" data-view="summary">品目まとめ</button>'+
      '</div>';
    if(soon.length && invKindFilter==="food"){
      html += '<div class="banner">🔔<div><b>'+soon.length+'件、賞味期限が近づいています</b>'+soon.map(function(i){return i.name;}).join("・")+
        '</div><button class="go" data-action="askSummary">声で詳しく聞く</button></div>';
    }
    html += '<div class="search">🔍<input id="searchInput" placeholder="アイテムを検索" value="'+escAttr(searchTerm)+'"></div>';
    html += '<div id="invListArea"></div>';
    document.getElementById("content").innerHTML = html;

    // 検索欄: #invListAreaだけを再描画するので、検索欄自体は作り直されずフォーカス・カーソル位置がそのまま保たれる
    var si = document.getElementById("searchInput");
    if(si) si.addEventListener("input", function(e){ searchTerm = e.target.value; renderInventoryList(); });
    var goV = document.querySelector('[data-action="askSummary"]');
    if(goV) goV.addEventListener("click", function(){ switchTab("voice"); runCommand("冷蔵庫に何入ってる?"); });
    document.querySelectorAll(".kind-tab:not(.view-tab)").forEach(function(btn){
      btn.addEventListener("click", function(){
        if(pendingConfirm || pendingSplit) return;
        invKindFilter = btn.getAttribute("data-kind");
        searchTerm = "";
        renderInventory();
      });
    });
    document.querySelectorAll(".view-tab").forEach(function(btn){
      btn.addEventListener("click", function(){
        if(pendingConfirm || pendingSplit) return;
        invViewMode = btn.getAttribute("data-view");
        renderInventory();
      });
    });
    wireConfirmCard();
    wireSplitCard();

    renderInventoryList();
  }

  // 在庫一覧(検索・並び替え結果)だけを再描画する。検索欄の入力のたびにここだけを呼ぶことで、
  // 検索欄そのものは作り直されずフォーカスが保たれる
  function renderInventoryList(){
    var area = document.getElementById("invListArea");
    if(!area) return;

    var list = inventory.filter(function(i){
      var m = findMaster(i.name);
      return i.kind===invKindFilter && nameMatchesSearch(i.name, searchTerm, m && m.yomi);
    });
    // 賞味期限不要(expiry=null)の食品は期限順では末尾に回す。消耗品には賞味期限が無いので常にInfinity扱い
    var expiryTime = function(i){ return i.expiry ? i.expiry.getTime() : Infinity; };
    // 優先度: 食品は賞味期限が近いほど、消耗品は数量が少ないほど優先度が高い(小さい値ほど上に来る)
    var priorityOf = function(i){ if(i.kind==="food") return expiryTime(i); var qn = parseQtyNum(i.qty); return qn ? qn.num : Infinity; };
    // 品目名ごとにグループ化し、そのグループ内で最も優先度が高い(=最小の)値を代表値として使う(同じ品目のロットが
    // リスト内でバラバラに散らばらないようにまとめ、グループ内は優先度が高い順に並べる)
    var groupMinPriority = {};
    list.forEach(function(i){
      var t = priorityOf(i);
      if(!(i.name in groupMinPriority) || t < groupMinPriority[i.name]) groupMinPriority[i.name] = t;
    });
    list = list.slice().sort(function(a,b){
      if(sortMode==="expiry"){
        if(a.name!==b.name && groupMinPriority[a.name]!==groupMinPriority[b.name]) return groupMinPriority[a.name]-groupMinPriority[b.name];
        if(a.name!==b.name) return a.name.localeCompare(b.name,"ja");
        return priorityOf(a)-priorityOf(b);
      }
      return a.name.localeCompare(b.name,"ja");
    });

    var priorityLabel = invKindFilter==="food" ? "賞味期限が近い順" : "残りが少ない順";
    var html = '<div class="sort-row"><span>'+list.length+'件</span><button id="sortToggle">'+(sortMode==="expiry"?"名前順にする":priorityLabel+"にする")+'</button></div>';

    if(invViewMode==="summary"){
      // 品目まとめ(閲覧専用): 同じ品目名のロットを1行に集計して表示するだけで、編集操作は一切ない
      var groupOrder = [], groupMap = {};
      list.forEach(function(i){
        if(!groupMap[i.name]){ groupMap[i.name] = {name:i.name, emoji:i.emoji, kind:i.kind, items:[]}; groupOrder.push(groupMap[i.name]); }
        groupMap[i.name].items.push(i);
      });
      if(!groupOrder.length) html += '<div class="empty">見つかりませんでした</div>';
      else groupOrder.forEach(function(g){
        var count = g.items.length;
        var subLabel, totalLabel;
        var sameUnit = true, totalNum = 0, unitRef = null;
        g.items.forEach(function(it){
          var qn = parseQtyNum(it.qty);
          if(!qn){ sameUnit=false; return; }
          if(unitRef===null) unitRef=qn.unit; else if(unitRef!==qn.unit) sameUnit=false;
          totalNum += qn.num;
        });
        totalLabel = sameUnit ? '合計'+(Math.round(totalNum*100)/100)+unitRef : count+'件';
        if(count>1) totalLabel += '('+count+'件)';
        if(g.kind==="food"){
          var expiries = g.items.filter(function(it){return it.expiry;}).map(function(it){return it.expiry.getTime();});
          if(expiries.length){
            subLabel = (count>1 ? '最短 ' : '') + fmt(new Date(Math.min.apply(null,expiries))) + 'まで';
            if(expiries.length<count) subLabel += ' ・期限なし'+(count-expiries.length)+'件';
          } else subLabel = '期限なし';
        } else {
          subLabel = isBelowSafetyStock(g.name) ? '安全在庫を下回っています' : '';
        }
        var lowStockPill = isBelowSafetyStock(g.name) ? '<span class="pill warn">在庫少</span>' : '';
        html += '<div class="item-card summary-row"><span class="item-emoji">'+g.emoji+'</span><div class="item-main"><div class="item-name">'+g.name+'</div>'+
          '<div class="item-meta">'+subLabel+'</div></div>'+lowStockPill+'<span class="summary-total">'+totalLabel+'</span></div>';
      });
    }
    // 品目カード(ロット別): タップで数量・賞味期限の編集カード(分割編集/登録・キャンセル)を開く。
    // 同名ロットが複数あってもリスト上は隣接して並ぶだけで、それぞれ独立した普通のカードとして表示する
    else if(!list.length) html += '<div class="empty">見つかりませんでした</div>';
    else list.forEach(function(i){
      var pillHtml;
      if(i.kind==="food"){
        pillHtml = i.expiry
          ? '<span class="pill '+statusOf(i.expiry)+'">'+statusLabel(i.expiry)+'</span>'
          : '<span class="pill noexp">期限なし</span>';
      } else {
        pillHtml = isBelowSafetyStock(i.name) ? '<span class="pill warn">在庫少</span>' : '';
      }
      var regHtml = i.registeredAt ? '<br><span class="item-reg">'+fmt(i.registeredAt)+'登録</span>' : '';
      var metaHtml = ((i.kind==="food" && i.expiry) ? (i.qty+' ・ <span class="num">'+fmt(i.expiry)+'</span>') : i.qty) + regHtml;
      html += '<div class="item-card">'+
        '<button type="button" class="item-tap" data-id="'+i.id+'"><span class="item-emoji">'+i.emoji+'</span><div class="item-main"><div class="item-name">'+i.name+'</div>'+
        '<div class="item-meta">'+metaHtml+'</div></div>'+pillHtml+'</button>'+
        '<button class="consume-btn quick-consume-btn" data-id="'+i.id+'">消費×1</button></div>';
    });
    area.innerHTML = html;

    var st2 = document.getElementById("sortToggle");
    if(st2) st2.addEventListener("click", function(){ sortMode = sortMode==="expiry"?"name":"expiry"; renderInventoryList(); });
    // 消費ボタンは確認なしでその場で1個減らす(0になったら削除)。食品・消耗品共通の挙動
    area.querySelectorAll(".quick-consume-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        if(pendingConfirm || pendingSplit){
          var card = document.querySelector(".confirm-card, .split-card");
          if(card) card.scrollIntoView({behavior:"smooth", block:"start"});
          return;
        }
        var id = Number(btn.getAttribute("data-id"));
        var item = inventory.find(function(i){ return i.id===id; });
        if(!item) return;
        var qn = parseQtyNum(item.qty) || {num:1, unit:"点"};
        var remain = Math.round((qn.num-1)*100)/100;
        if(remain <= 0) inventory = inventory.filter(function(i){ return i.id!==id; });
        else item.qty = remain+qn.unit;
        // 安全在庫を下回ったら、確認なしで買い物リストにも追加し、追加したことを会話ログ+音声で知らせる
        if(isBelowSafetyStock(item.name) && !shopping.find(function(s){return s.name===item.name;})){
          shopping.push({id:nextId(), name:item.name, emoji:item.emoji, done:false});
          var addMsg = item.name + "は在庫が少なくなったので買い物リストに追加しておいたよ。";
          chatLog.push({who:"app", text:addMsg});
          speakAloud(addMsg);
        }
        currentRecipes = pickRecipes();
        saveState();
        // 賞味期限が近い品目バナー(soon)は殻側で計算しているため、消費で在庫が変わった際は殻ごと再描画する
        renderInventory();
      });
    });
    area.querySelectorAll(".item-tap").forEach(function(btn){
      btn.addEventListener("click", function(){ startSplitEdit(Number(btn.getAttribute("data-id"))); });
    });
  }

  function renderShopping(){
    var html = '<div class="screen-title"><h2>買い物リスト</h2><span class="sub">'+shopping.filter(function(s){return !s.done;}).length+'件 未購入</span></div>';
    html += '<div class="compose"><input id="shopAddInput" placeholder="品目を入力して追加" autocomplete="off"><button id="shopAddBtn">追加</button></div>';
    if(!recoDismissed) html += '<div class="reco">前回の購入から3週間、そろそろ<b>米</b>を買う時期かも<button id="recoAdd">追加</button></div>';
    if(!shopping.length) html += '<div class="empty">買い物リストは空です</div>';
    else shopping.forEach(function(s){
      html += '<div class="shop-row"><button class="check '+(s.done?"done":"")+'" data-id="'+s.id+'">'+(s.done?"✓":"")+'</button>'+
        '<span class="item-emoji" style="font-size:18px;width:22px;">'+s.emoji+'</span><span class="shop-name '+(s.done?"done":"")+'">'+s.name+'</span></div>';
    });
    document.getElementById("content").innerHTML = html;

    var shopAddInput = document.getElementById("shopAddInput");
    var shopAddBtn = document.getElementById("shopAddBtn");
    function doShopAdd(){
      var v = shopAddInput.value.trim();
      if(!v) return;
      if(!shopping.find(function(s){return s.name===v;})) shopping.push({id:nextId(), name:v, emoji:emojiFor(v), done:false});
      shopAddInput.value = "";
      saveState(); renderShopping();
    }
    shopAddBtn.addEventListener("click", doShopAdd);
    shopAddInput.addEventListener("keydown", function(e){ if(e.key==="Enter") doShopAdd(); });

    var ra = document.getElementById("recoAdd");
    if(ra) ra.addEventListener("click", function(){ shopping.push({id:nextId(), name:"米", emoji:"🍚", done:false}); recoDismissed=true; saveState(); renderShopping(); });
    document.querySelectorAll(".check").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = Number(btn.getAttribute("data-id"));
        var item = shopping.find(function(s){return s.id===id;});
        if(!item) return;
        shopping = shopping.filter(function(s){return s.id!==id;});
        if(masterKindFor(item.name) === "good"){
          inventory.push({id:nextId(), kind:"good", name:item.name, emoji:item.emoji, qty:"1"+defaultUnitFor(item.name), registeredAt:new Date()});
        } else {
          inventory.push({id:nextId(), kind:"food", name:item.name, emoji:item.emoji, expiry: needsExpiryDefault(item.name) ? addDays(estimateShelfLife(item.name)) : null, qty:"1"+defaultUnitFor(item.name), registeredAt:new Date()});
        }
        mergeDuplicateLots();
        currentRecipes = pickRecipes();
        saveState(); renderShopping();
      });
    });
  }

  function renderBubble(b){ return '<div class="bubble-row '+b.who+'"><div class="bubble '+b.who+'">'+b.text+(b.tag?'<span class="tag">'+b.tag+'</span>':'')+'</div></div>'; }

  // 登録前の確認カード: 何をする操作か(在庫登録/買い物リスト/消費)・品目・数量・賞味期限を表示してOK/キャンセル
  var CONFIRM_BADGE = {inventory:"在庫登録", shopping:"買い物リスト", consume:"消費"};
  var CONFIRM_TITLE = {inventory:"この内容で在庫に登録する?", shopping:"この内容で買い物リストに追加する?", consume:"この内容で消費済みにする?"};
  function escAttr(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  // 検索用: カタカナをひらがなに寄せて比較することで、ひらがな・カタカナどちらで入力しても同じ品目名にヒットするようにする
  function normalizeKana(s){
    return String(s==null?"":s).replace(/[ァ-ヶ]/g, function(ch){ return String.fromCharCode(ch.charCodeAt(0) - 0x60); });
  }
  // 品目名だけでなく、マスタに登録された読み仮名(yomi)にもヒットするようにする。
  // 例えば品目名が漢字表記の「牛乳」でも、yomi:"ぎゅうにゅう" を持たせておけば「ぎゅうにゅう」で検索できる
  function nameMatchesSearch(name, term, yomi){
    if(!term) return true;
    var t = normalizeKana(term);
    if(normalizeKana(name).indexOf(t) !== -1) return true;
    return !!yomi && normalizeKana(yomi).indexOf(t) !== -1;
  }
  // 新しくマスタ登録しようとしている品目名に似た既存マスタ品目があれば教えることで、
  // 「冷凍エビ」のつもりで「冷凍」とだけ入力した時などに、既に似た品目が登録済みだと気づけるようにする(重複登録の予防)
  function findSimilarMasterNames(term, limit){
    var t = normalizeKana(String(term||"").trim());
    if(!t) return [];
    return masterList.filter(function(m){
      return normalizeKana(m.name).indexOf(t) !== -1 || (m.yomi && normalizeKana(m.yomi).indexOf(t) !== -1);
    }).map(function(m){ return m.name; }).slice(0, limit||5);
  }

  function renderConfirmCard(pc){
    var rows = pc.items.map(function(it, idx){
      if(pc.kind === "inventory"){
        var inMaster = !!findMaster(it.name);
        var masterBadge = inMaster
          ? '<div class="master-status known">マスタ登録済み</div>'
          : '<label class="master-status unknown"><input type="checkbox" class="confirm-regmaster" data-idx="'+idx+'"'+(it.registerMaster!==false?" checked":"")+'>マスタ未登録・OKと同時に登録する</label>';
        // マスタ未登録 かつ「OKと同時に登録する」がチェックされている間だけ、
        // 種別(食品/消耗品)と数量の単位をこのカード上で選べるようにする
        var showMasterFields = !inMaster && it.registerMaster !== false;
        // マスタ登録済みの食品は、名前・種別・要否は既にマスタ側で確定しているものとして扱い、
        // このカードでは賞味期限と数量だけ変更できれば十分にする(誤って別項目をいじれないようにする意図)
        var isMasteredFood = inMaster && it.itemKind !== "good";
        var kindSelectHtml = showMasterFields
          ? '<select class="confirm-item-kind" data-idx="'+idx+'">'+
              '<option value="food"'+(it.itemKind!=="good"?" selected":"")+'>食品</option>'+
              '<option value="good"'+(it.itemKind==="good"?" selected":"")+'>消耗品</option>'+
            '</select>'
          : (it.itemKind === "good" ? '<span class="confirm-kind-tag">消耗品</span>' : '');

        var emojiHtml = showMasterFields ? iconPickerHtml("c"+idx, it.emoji) : '<span class="item-emoji">'+it.emoji+'</span>';

        // マスタ登録済みでも音声認識の誤認識で違う品目名になっている可能性があるため、常に編集できるようにする。
        // 編集して未登録の名前に変えた場合は、この後の再描画でinMaster/isMasteredFoodが再計算され、
        // 自動的に「マスタ未登録」用の表示(種別選択・単位選択・マスタ登録チェック等)に切り替わる
        var nameFieldHtml = '<input type="text" class="confirm-name" data-idx="'+idx+'" value="'+escAttr(it.name)+'">';

        // 数量は食品・消耗品共通で入力する。賞味期限まわり(日付欄・賞味期限不要チェック)は食品のみ表示する。
        // 単位はマスタ登録済み品目なら既にマスタ側で決まっているため、ここでは変更できないようにする(数値だけ変更可能)
        var qtyFieldsHtml = qtyStepperHtml(idx, it.qty, inMaster);
        var dateFieldHtml = (it.itemKind !== "good" && !it.noExpiry) ? '<input type="date" class="confirm-date" data-idx="'+idx+'" value="'+isoDate(it.expiry)+'">' : '';
        // マスタ登録済みの食品は賞味期限の要否も既にマスタ側の設定に従うため、ここでは切り替えない
        var noExpiryToggleHtml = (it.itemKind !== "good" && !isMasteredFood)
          ? '<label class="confirm-shop-toggle"><input type="checkbox" class="confirm-noexpiry" data-idx="'+idx+'"'+(it.noExpiry?" checked":"")+'>賞味期限不要</label>'
          : '';
        // マスタ未登録品目は、ここで安全在庫(設定不要 or 数量)も選べる
        var safetyHasValue = it.safetyStock!=null;
        var safetyToggleHtml = showMasterFields
          ? '<label class="confirm-shop-toggle"><input type="checkbox" class="confirm-hassafety" data-idx="'+idx+'"'+(safetyHasValue?" checked":"")+'>安全在庫を設定する</label>'+
            (safetyHasValue ? '<div class="confirm-qty-row"><input type="number" min="0" class="confirm-safety-num" data-idx="'+idx+'" value="'+it.safetyStock+'" placeholder="数量"></div>' : '')
          : '';
        // マスタ未登録(=これから新規登録されるかもしれない)品目だけ、似た既存品目名のヒントを表示する枠を用意しておく
        // (中身はwireConfirmCard側でinputイベントのたびに書き換える。カード全体は再描画しないので入力中のフォーカスは維持される)
        var dupHintHtml = !inMaster ? '<div class="confirm-dup-hint" id="confirmDupHint'+idx+'" hidden></div>' : '';
        return '<div class="confirm-row">'+emojiHtml+
          nameFieldHtml+
          kindSelectHtml+
          '</div>'+
          dupHintHtml+
          '<div class="confirm-qty-row">'+qtyFieldsHtml+dateFieldHtml+'</div>'+
          noExpiryToggleHtml+safetyToggleHtml+masterBadge;
      }
      if(pc.kind === "shopping"){
        return '<div class="confirm-row"><span class="item-emoji">'+it.emoji+'</span><span class="nm">'+it.name+'</span></div>';
      }
      // consume: 同名ロットが複数ある場合はFEFO的な自動消費(食品は賞味期限が近い順、消耗品は登録順)がデフォルト。
      // チェックを外せば従来通り候補チップから個別に選ぶ方式に切り替えられる(カップ麺など順番通りに使いたくない場合向け)。
      // ロットが1件だけなら詳細を、0件なら新規追加の旨を出す
      var isMultiLot = it.candidates.length>=2;
      var selectedCand = it.candidates.find(function(c){ return c.id===it.selectedId; });
      var fefoToggleHtml = "";
      var showQty;
      var sub = "";
      if(isMultiLot){
        var fefoOn = it.useFEFO !== false;
        var fefoLabel = it.candidates[0].kind==="food" ? "賞味期限が近いものから順に使う" : "自動でロットを選んで使う";
        fefoToggleHtml = '<label class="confirm-shop-toggle"><input type="checkbox" class="confirm-fefo-toggle" data-idx="'+idx+'"'+(fefoOn?" checked":"")+'>'+fefoLabel+'</label>';
        if(fefoOn){
          showQty = true;
          var lotsSorted = it.candidates.slice().sort(function(a,b){
            var ai = inventory.find(function(i){return i.id===a.id;});
            var bi = inventory.find(function(i){return i.id===b.id;});
            var at = (ai&&ai.expiry) ? ai.expiry.getTime() : Infinity;
            var bt = (bi&&bi.expiry) ? bi.expiry.getTime() : Infinity;
            return at-bt;
          });
          sub = '<div class="confirm-sub">在庫: '+lotsSorted.map(function(c){return c.sub;}).join(' ・ ')+'</div>';
        } else {
          showQty = !!selectedCand;
          sub = '<div class="confirm-candidates">'+it.candidates.map(function(c){
            return '<button class="cand-chip'+(it.selectedId===c.id?" selected":"")+'" data-idx="'+idx+'" data-cand="'+c.id+'">'+c.label+'<span>'+c.sub+'</span></button>';
          }).join("")+'</div>';
        }
      } else {
        showQty = it.candidates.length > 0;
        if(it.candidates.length >= 2){
          sub = '<div class="confirm-candidates">'+it.candidates.map(function(c){
            return '<button class="cand-chip'+(it.selectedId===c.id?" selected":"")+'" data-idx="'+idx+'" data-cand="'+c.id+'">'+c.label+'<span>'+c.sub+'</span></button>';
          }).join("")+'</div>';
        } else if(it.candidates.length === 1){
          sub = '<div class="confirm-sub">'+it.candidates[0].sub+'</div>';
        } else {
          sub = '<div class="confirm-sub">在庫になかったので新規の消耗品として追加するよ</div>';
        }
      }
      var shopLabel = '<label class="confirm-shop-toggle"><input type="checkbox" class="confirm-addshop" data-idx="'+idx+'"'+(it.addToShopping!==false?" checked":"")+'>買い物リストにも追加</label>';
      // 消費数量は在庫を超えて指定できないよう、選択中のロット(またはFEFO合計)の数量を上限にする
      var maxQty = showQty ? maxConsumeQtyFor(it.name, it.candidates, it.useFEFO, it.selectedId) : null;
      return '<div class="confirm-row"><span class="item-emoji">'+it.emoji+'</span>'+
        '<input type="text" class="confirm-name" data-idx="'+idx+'" value="'+escAttr(it.name)+'">'+
        '</div>'+
        fefoToggleHtml+
        // 消費は既存ロットから減らすだけの操作で、単位は消費対象ロットの単位に固定されるべき(選べてしまうのはバグ)。
        // lockUnitを常にtrueにして、数量(個数)だけ変更できるようにする
        (showQty ? '<div class="confirm-qty-row">'+qtyStepperHtml(idx, it.qty, true, maxQty)+'</div>' : '')+
        sub+shopLabel;
    }).join("");
    return '<div class="confirm-card"><div class="title"><span class="badge">'+CONFIRM_BADGE[pc.kind]+'</span>'+CONFIRM_TITLE[pc.kind]+'</div>'+
      '<div class="confirm-list">'+rows+'</div>'+
      '<div class="confirm-actions"><button id="confirmCancel">キャンセル</button><button class="primary" id="confirmOk">OK</button></div></div>';
  }

  function renderVoice(){
    var html = '<div class="screen-title"><h2>声で入力</h2><span class="sub">'+(micSupported?"マイクを押して話す":"文字入力")+'</span></div>';

    html += '<div class="mic-zone"><button class="mic-btn" id="micBtn" '+(micSupported?"":"disabled")+'>🎙️</button>'+
      '<div class="mic-caption" id="micCaption">'+(micSupported ? "タップして話しかけて" : "この端末では自動音声入力が使えないみたい")+'</div></div>';

    html += '<div class="divider-or">または文字で</div>';
    html += '<div class="compose"><input id="voiceInput" placeholder="例: 牛乳買った" autocomplete="off"><button id="sendBtn">送信</button></div>';
    html += '<div class="voice-hint">入力欄をタップ→キーボードの <span class="kbd">🎙️</span> マイクでも話せます。</div>';
    html += '<label class="speak-toggle"><input type="checkbox" id="speakToggle" '+(speakOn?"checked":"")+'> 返事を音声でも読み上げる</label>';

    // 例文チップはユーザーが自由に追加・削除できる(よく使う言い回しを自分用にカスタマイズできるように)。
    // 編集モード中はチップ本文をボタンにせず削除ボタンのみ有効にし、誤ってコマンドが送信されないようにする
    html += '<div class="chip-group-label">例文(タップで送信)<button type="button" id="voiceExamplesEditToggle" class="chip-edit-toggle">'+(voiceExamplesEditMode?"完了":"編集")+'</button></div>';
    html += '<div class="chips">'+voiceExamples.map(function(p,idx){ return voiceExamplesEditMode ? chipEditable(p,idx) : chip(p); }).join("")+'</div>';
    if(voiceExamplesEditMode){
      html += '<div class="compose"><input id="newExampleInput" placeholder="例文を追加(例: 卵買った)" autocomplete="off"><button id="addExampleBtn">追加</button></div>';
    }

    if(pendingConfirm) html += renderConfirmCard(pendingConfirm);

    if(chatLog.length){
      // 新しい発言ほど上に表示する
      html += '<div class="bubble-log" id="bubbleLog">'+chatLog.slice().reverse().map(renderBubble).join("")+'</div>';
    }

    document.getElementById("content").innerHTML = html;

    var input = document.getElementById("voiceInput");
    var send = document.getElementById("sendBtn");
    function doSend(){
      var v = input.value.trim();
      if(!v) return;
      input.value = "";
      runCommand(v);
    }
    send.addEventListener("click", doSend);
    input.addEventListener("keydown", function(e){ if(e.key==="Enter") doSend(); });

    var micBtn = document.getElementById("micBtn");
    if(micBtn) micBtn.addEventListener("click", function(){ toggleListening(); });

    document.getElementById("speakToggle").addEventListener("change", function(e){ speakOn = e.target.checked; saveFlagState(); });
    // chip-editable(編集モード中のチップ)は見た目を揃えるためclass="chip"も併用しているが、
    // data-phrase属性を持たずコマンド送信の対象ではないため、ここでは明示的に除外する
    document.querySelectorAll(".chip:not(.chip-editable)").forEach(function(c){
      c.addEventListener("click", function(){ runCommand(c.getAttribute("data-phrase")); });
    });
    var exEditToggle = document.getElementById("voiceExamplesEditToggle");
    if(exEditToggle) exEditToggle.addEventListener("click", function(){ voiceExamplesEditMode = !voiceExamplesEditMode; renderVoice(); });
    document.querySelectorAll(".chip-remove").forEach(function(btn){
      btn.addEventListener("click", function(){
        voiceExamples.splice(Number(btn.getAttribute("data-idx")), 1);
        saveState(); renderVoice();
      });
    });
    var addExBtn = document.getElementById("addExampleBtn");
    var newExInput = document.getElementById("newExampleInput");
    if(addExBtn && newExInput){
      var doAddExample = function(){
        var v = newExInput.value.trim();
        if(!v) return;
        // 追加前に実際にparseCommand()へ通し、在庫登録/消費/買い物追加/確認/献立などの
        // 認識できる言い回しに当てはまるか確認する。当てはまらない(unknown = 品目名としてそのまま
        // 買い物リストに追加される扱いになる)場合は、意図した通りに動かないかもしれないと警告する
        var cmd = parseCommand(v);
        if(!cmd || cmd.type === "unknown"){
          var proceed = confirm("「"+v+"」は、在庫登録・消費・買い物・確認・献立のどの言い方としても認識できないかもしれません。このままだと品目名としてそのまま買い物リストに追加される扱いになります。このまま例文に追加しますか?");
          if(!proceed) return;
        }
        voiceExamples.push(v);
        saveState(); renderVoice();
      };
      addExBtn.addEventListener("click", doAddExample);
      newExInput.addEventListener("keydown", function(e){ if(e.key==="Enter") doAddExample(); });
    }
    wireConfirmCard();

    // 確認カードが出ている間はそのカードまでスクロールを合わせる(送信直後だけでなく、
    // カード内の入力をいじって再描画された時も毎回ここに戻ってきてしまわないよう、
    // 常にカードの位置を基準にする)。無ければ従来通り、新しい発言が一番上に来るので先頭に合わせる
    var content = document.getElementById("content");
    if(content){
      var card = content.querySelector(".confirm-card");
      if(card) card.scrollIntoView({behavior:"smooth", block:"start"});
      else content.scrollTop = 0;
    }
  }

  // 確認カードの操作(声タブ・在庫タブなど、確認カードを表示するどの画面からでも呼び出せる共通配線)
  function wireConfirmCard(){
    var okBtn = document.getElementById("confirmOk"); if(okBtn) okBtn.addEventListener("click", function(){ resolveConfirm(true); });
    var cancelBtn = document.getElementById("confirmCancel"); if(cancelBtn) cancelBtn.addEventListener("click", function(){ resolveConfirm(false); });
    document.querySelectorAll(".confirm-date").forEach(function(inp){
      inp.addEventListener("change", function(e){
        var idx = Number(inp.getAttribute("data-idx"));
        if(!e.target.value || !pendingConfirm) return;
        pendingConfirm.items[idx].expiry = parseIsoDate(e.target.value);
        saveState();
      });
    });
    // 似た既存マスタ品目名のヒント: 1文字打つたびに更新したいが、カード全体を再描画すると入力中のフォーカスが
    // 外れてしまう(モバイルでキーボードが閉じる・二重入力になる不具合の原因になった経緯があるため)ので、
    // ヒント欄(confirmDupHint{idx})のテキストだけをその場で書き換える。対象の枠が無い行(マスタ登録済み品目・
    // 消費カードの名前欄など)ではhintがnullになるので何もしない
    document.querySelectorAll(".confirm-name").forEach(function(inp){
      inp.addEventListener("input", function(e){
        var idx = Number(inp.getAttribute("data-idx"));
        var hint = document.getElementById("confirmDupHint"+idx);
        if(!hint) return;
        var matches = findSimilarMasterNames(e.target.value, 5);
        if(matches.length){ hint.hidden = false; hint.textContent = "似た品目名: "+matches.join("・"); }
        else { hint.hidden = true; hint.textContent = ""; }
      });
    });
    document.querySelectorAll(".confirm-name").forEach(function(inp){
      inp.addEventListener("change", function(e){
        if(!pendingConfirm) return;
        var idx = Number(inp.getAttribute("data-idx"));
        var newName = e.target.value.trim();
        if(!newName) return;
        var it = pendingConfirm.items[idx];
        it.name = newName;
        it.emoji = emojiFor(newName);
        if(pendingConfirm.kind === "consume"){
          // 品目名を直したら消費候補も探し直す
          var candidates = buildConsumeCandidates(newName);
          it.candidates = candidates;
          var multiLotFood = candidates.length>=2 && candidates[0].kind==="food";
          it.selectedId = (!multiLotFood && candidates.length===1) ? candidates[0].id : null;
          it.useFEFO = multiLotFood;
        }
        if(pendingConfirm.kind === "inventory"){
          // 品目名を直すたびマスタの有無を確認し、種別・賞味期限まわりの既定値を再適用する
          it.itemKind = masterKindFor(newName);
          it.qty = it.qty || ("1"+defaultUnitFor(newName));
          if(it.itemKind === "good"){
            delete it.expiry; delete it.noExpiry;
          } else {
            it.expiry = addDays(estimateShelfLife(newName));
            it.noExpiry = !needsExpiryDefault(newName);
          }
        }
        saveState(); RENDER[activeTab]();
      });
    });
    document.querySelectorAll(".cand-chip").forEach(function(btn){
      btn.addEventListener("click", function(){
        if(!pendingConfirm) return;
        var idx = Number(btn.getAttribute("data-idx"));
        var it = pendingConfirm.items[idx];
        it.selectedId = Number(btn.getAttribute("data-cand"));
        // 選び直したロットの在庫を超えて消費数量が残っていたらクランプする
        if(pendingConfirm.kind === "consume"){
          var maxQty = maxConsumeQtyFor(it.name, it.candidates, it.useFEFO, it.selectedId);
          var qn = parseQtyNum(it.qty);
          if(maxQty!=null && qn && qn.num>maxQty) it.qty = maxQty+qn.unit;
        }
        saveState(); RENDER[activeTab]();
      });
    });
    document.querySelectorAll(".confirm-addshop").forEach(function(cb){
      cb.addEventListener("change", function(e){
        if(!pendingConfirm) return;
        var idx = Number(cb.getAttribute("data-idx"));
        pendingConfirm.items[idx].addToShopping = e.target.checked;
        saveState();
      });
    });
    document.querySelectorAll(".confirm-noexpiry").forEach(function(cb){
      cb.addEventListener("change", function(e){
        if(!pendingConfirm) return;
        var idx = Number(cb.getAttribute("data-idx"));
        pendingConfirm.items[idx].noExpiry = e.target.checked;
        saveState(); RENDER[activeTab]();
      });
    });
    document.querySelectorAll(".confirm-hassafety").forEach(function(cb){
      cb.addEventListener("change", function(e){
        if(!pendingConfirm) return;
        var idx = Number(cb.getAttribute("data-idx"));
        pendingConfirm.items[idx].safetyStock = e.target.checked ? 0 : null;
        saveState(); RENDER[activeTab]();
      });
    });
    document.querySelectorAll(".confirm-safety-num").forEach(function(inp){
      inp.addEventListener("change", function(e){
        if(!pendingConfirm) return;
        var idx = Number(inp.getAttribute("data-idx"));
        var v = parseInt(e.target.value,10);
        pendingConfirm.items[idx].safetyStock = (isNaN(v)||v<0) ? 0 : v;
        saveState();
      });
    });
    document.querySelectorAll(".confirm-regmaster").forEach(function(cb){
      cb.addEventListener("change", function(e){
        if(!pendingConfirm) return;
        var idx = Number(cb.getAttribute("data-idx"));
        pendingConfirm.items[idx].registerMaster = e.target.checked;
        // チェック状態で種別/数量単位の選択UIを出し分けるため再描画する
        saveState(); RENDER[activeTab]();
      });
    });
    document.querySelectorAll(".confirm-fefo-toggle").forEach(function(cb){
      cb.addEventListener("change", function(e){
        if(!pendingConfirm) return;
        var idx = Number(cb.getAttribute("data-idx"));
        var it = pendingConfirm.items[idx];
        it.useFEFO = e.target.checked;
        // FEFO ON/OFFで消費できる上限(合計 or 個別ロット数量)が変わるため、超えていればクランプする
        if(pendingConfirm.kind === "consume"){
          var maxQty = maxConsumeQtyFor(it.name, it.candidates, it.useFEFO, it.selectedId);
          var qn = parseQtyNum(it.qty);
          if(maxQty!=null && qn && qn.num>maxQty) it.qty = maxQty+qn.unit;
        }
        // ON/OFFで数量ステッパー表示と個別選択チップ表示を出し分けるため再描画する
        saveState(); RENDER[activeTab]();
      });
    });
    document.querySelectorAll(".confirm-item-kind").forEach(function(sel){
      sel.addEventListener("change", function(e){
        if(!pendingConfirm) return;
        var idx = Number(sel.getAttribute("data-idx"));
        var it = pendingConfirm.items[idx];
        it.itemKind = e.target.value;
        it.qty = it.qty || ("1"+defaultUnitFor(it.name));
        if(it.itemKind === "good"){
          delete it.expiry; delete it.noExpiry;
        } else {
          it.expiry = addDays(estimateShelfLife(it.name));
          it.noExpiry = !needsExpiryDefault(it.name);
        }
        saveState(); RENDER[activeTab]();
      });
    });
    // 数量ステッパー: 数値入力欄と単位セレクトの現在値を組み合わせてit.qtyに反映する(全体の再描画はしない=入力中のフォーカスを保つ)
    function applyQtyStepper(idx){
      var numInp = document.querySelector('.confirm-qty-num[data-idx="'+idx+'"]');
      if(!numInp || !pendingConfirm) return;
      var unitSel = document.querySelector('.confirm-qty-unit[data-idx="'+idx+'"]');
      var n = parseFloat(numInp.value);
      if(isNaN(n) || n<0) n = 0;
      // 消費数量は在庫(data-maxに埋め込んだ上限)を超えて入力できないようにする
      var maxAttr = numInp.getAttribute("data-max");
      if(maxAttr!=null){
        var maxN = parseFloat(maxAttr);
        if(!isNaN(maxN) && n>maxN) n = maxN;
      }
      numInp.value = n;
      // 単位セレクトが無い(マスタ登録済み品目で単位が固定表示のみの)行は、
      // 数量欄自体に埋め込んだdata-unitから単位を取る
      var unit = unitSel ? unitSel.value : (numInp.getAttribute("data-unit") || "点");
      var it = pendingConfirm.items[idx];
      it.qty = n + unit;
      // 消費確認カードは、数量を変更するたびに「使用後の在庫が安全在庫以下になるか」を判定し直し、
      // 「買い物リストにも追加」チェックの状態をその都度更新する
      if(pendingConfirm.kind === "consume"){
        it.addToShopping = willBeBelowSafetyStockAfterConsume(it.name, it.qty);
        var shopCb = document.querySelector('.confirm-addshop[data-idx="'+idx+'"]');
        if(shopCb) shopCb.checked = it.addToShopping;
      }
      saveState();
    }
    document.querySelectorAll(".confirm-qty-num").forEach(function(inp){
      inp.addEventListener("change", function(){ applyQtyStepper(Number(inp.getAttribute("data-idx"))); });
    });
    document.querySelectorAll(".confirm-qty-unit").forEach(function(sel){
      sel.addEventListener("change", function(){
        var idx = Number(sel.getAttribute("data-idx"));
        var numInp = document.querySelector('.confirm-qty-num[data-idx="'+idx+'"]');
        if(numInp) numInp.step = qtyStepFor(sel.value);
        applyQtyStepper(idx);
      });
    });
    document.querySelectorAll(".qty-dec, .qty-inc").forEach(function(btn){
      btn.addEventListener("click", function(){
        var idx = Number(btn.getAttribute("data-idx"));
        var numInp = document.querySelector('.confirm-qty-num[data-idx="'+idx+'"]');
        if(!numInp) return;
        var step = parseFloat(numInp.step) || 1;
        var n = parseFloat(numInp.value); if(isNaN(n)) n = 0;
        n = btn.classList.contains("qty-inc") ? n+step : Math.max(0, n-step);
        numInp.value = (Math.round(n*100)/100);
        applyQtyStepper(idx);
      });
    });
    // 確認カード内のアイコンピッカー(マスタ未登録品目のみ表示。key形式は"c"+idx)
    document.querySelectorAll(".icon-toggle").forEach(function(btn){
      btn.addEventListener("click", function(){
        var key = btn.getAttribute("data-key");
        var panel = document.querySelector('.icon-picker[data-key="'+key+'"]');
        if(!panel) return;
        var willOpen = panel.hidden;
        document.querySelectorAll(".icon-picker").forEach(function(p){ p.hidden = true; });
        panel.hidden = !willOpen;
      });
    });
    document.querySelectorAll(".icon-choice").forEach(function(btn){
      btn.addEventListener("click", function(){
        var key = btn.getAttribute("data-key");
        var emoji = btn.getAttribute("data-emoji");
        if(!pendingConfirm || key.charAt(0)!=="c") return;
        var idx = Number(key.slice(1));
        pendingConfirm.items[idx].emoji = emoji;
        saveState(); RENDER[activeTab]();
      });
    });
    updateTabLockUI();
  }
  function saveFlagState(){ saveState(); }
  function chip(p){ return '<button class="chip" data-phrase="'+escAttr(p)+'">「'+escAttr(p)+'」</button>'; }
  // 例文編集モード用: チップ本文はボタンにせず(誤ってコマンドが送信されるのを防ぐ)、削除ボタンだけ付ける
  function chipEditable(p, idx){
    return '<span class="chip chip-editable"><span class="chip-text">「'+escAttr(p)+'」</span>'+
      '<button type="button" class="chip-remove" data-idx="'+idx+'">✕</button></span>';
  }

  function renderRecipe(){
    var soon = inventory.filter(function(i){return i.kind==="food" && i.expiry && statusOf(i.expiry)==="warn";}).map(function(i){return i.name;});
    var fresh = inventory.filter(function(i){return i.kind==="food" && (!i.expiry || daysLeft(i.expiry)>=0);}).map(function(i){return i.name;});
    var html = '<div class="screen-title"><h2>今日の献立</h2><span class="sub">在庫ベースの提案・'+currentRecipes.length+'件</span></div>';
    html += currentRecipes.map(function(r, idx){
      var why = r.need.filter(function(n){return soon.indexOf(n)!==-1;});
      var missing = r.need.filter(function(n){return fresh.indexOf(n)===-1;});
      // 食材が1つだけ足りない場合は「買い足せば作れる」という前向きな案内にする(意図的に混ぜている提案のため)。
      // 2つ以上足りない場合は、あくまで3件を埋めるためのフォールバックなので控えめに「足りないかも」とだけ伝える
      var whyHtml = why.length ? '<div class="why">⏰ '+why.join("・")+'の賞味期限が近いので提案</div>'
        : missing.length===1 ? '<div class="why buy">🛒 '+missing[0]+'を買い足せば作れる</div>'
        : missing.length>=2 ? '<div class="why missing">🛒 '+missing.join("・")+'が足りないかも</div>'
        : '<div class="why">🧊 今の在庫から作れる一品</div>';
      var isOpen = recipeOpenIdx===idx;
      var ingHtml = '<div class="recipe-ing">'+r.need.map(function(n){
        return '<span'+(missing.indexOf(n)!==-1?' class="missing"':'')+'>'+n+'</span>';
      }).join("")+'</div>';
      var stepsHtml = isOpen
        ? '<ol class="recipe-steps">'+r.steps.map(function(s){ return '<li>'+s+'</li>'; }).join("")+'</ol>'
        : '';
      return '<button type="button" class="recipe-card recipe-card-btn" data-idx="'+idx+'">'+whyHtml+
        '<h3>'+r.name+'</h3><div class="time">調理時間 目安 '+r.time+'</div>'+
        ingHtml+
        '<div class="recipe-toggle-hint">'+(isOpen?'タップで閉じる':'タップで作り方を見る')+'</div>'+
        stepsHtml+
        '</button>';
    }).join("");
    html += '<div class="chip-group-label">声でリクエストし直す</div><div class="chips">'+chip("今日何作ろう")+'</div>';
    document.getElementById("content").innerHTML = html;
    document.querySelectorAll(".recipe-card-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        var idx = Number(btn.getAttribute("data-idx"));
        recipeOpenIdx = (recipeOpenIdx===idx) ? null : idx;
        renderRecipe();
      });
    });
    document.querySelectorAll(".chip").forEach(function(c){ c.addEventListener("click", function(){ switchTab("voice"); setTimeout(function(){ runCommand(c.getAttribute("data-phrase")); },50); }); });
  }
