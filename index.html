  // マスタ登録画面: 品目ごとのアイコン・種別(食品/消耗品)・数量単位・賞味期限の要否・初期賞味期限日数を編集する。
  // 「品目」「数量単位」「初期賞味期限日数(+賞味期限あり)」「安全在庫」の4グループを1行ずつ縦に並べる
  function masterRow(m, idx){
    var isFood = m.kind !== "good";
    var hasSafety = m.safetyStock != null;
    return '<div class="master-row" data-idx="'+idx+'">'+
      '<div class="master-line master-line-item">'+
        iconPickerHtml(String(idx), m.emoji)+
        '<input type="text" class="master-name" data-idx="'+idx+'" value="'+escAttr(m.name)+'">'+
        '<select class="master-kind" data-idx="'+idx+'">'+
          '<option value="food"'+(isFood?" selected":"")+'>食品</option>'+
          '<option value="good"'+(!isFood?" selected":"")+'>消耗品</option>'+
        '</select>'+
      '</div>'+
      '<div class="master-line">'+
        '<span class="master-field-label">数量単位:</span>'+
        unitSelectHtml("master-unit", ' data-idx="'+idx+'"', m.unit||"点")+
      '</div>'+
      '<div class="master-line master-line-expiry"'+(isFood?"":' style="display:none"')+'>'+
        '<span class="master-field-label">初期賞味期限日数:</span>'+
        '<input type="number" inputmode="numeric" min="0" max="9999" class="master-days" data-idx="'+idx+'" value="'+(m.shelfLifeDays||7)+'"'+
          (isFood && m.needsExpiry!==false ? "" : " disabled")+'>'+
        '<span class="master-days-suffix">日</span>'+
        '<label class="master-needs">'+
          '<input type="checkbox" class="master-needsexpiry" data-idx="'+idx+'"'+(m.needsExpiry!==false?" checked":"")+'>賞味期限あり</label>'+
      '</div>'+
      '<div class="master-line">'+
        '<label class="master-needs"><input type="checkbox" class="master-hassafety" data-idx="'+idx+'"'+(hasSafety?" checked":"")+'>安全在庫:</label>'+
        '<div class="qty-stepper">'+
          '<button type="button" class="master-safety-inc" data-idx="'+idx+'"'+(hasSafety?"":" disabled")+'>+</button>'+
          '<input type="number" inputmode="numeric" class="master-safety-num" data-idx="'+idx+'" value="'+(hasSafety?m.safetyStock:0)+'" min="0" step="1"'+(hasSafety?"":" disabled")+'>'+
          '<button type="button" class="master-safety-dec" data-idx="'+idx+'"'+(hasSafety?"":" disabled")+'>−</button>'+
        '</div>'+
      '</div>'+
      '<div class="master-line master-line-actions">'+
        '<button type="button" class="master-update" data-idx="'+idx+'" hidden>更新</button>'+
        '<button class="master-del" data-idx="'+idx+'">削除</button>'+
      '</div>'+
      '</div>';
  }
  // マスタ登録画面の「殻」(タイトル・新規登録フォーム・検索欄・一覧の入れ物)を描画する。
  // 検索欄への1文字ごとの入力ではこの関数は呼ばない(呼ぶと検索欄自体が作り直されてフォーカスが外れ、
  // スマホではソフトキーボードが閉じたり文字が二重入力されたりする) — 検索・ページ送りはrenderMasterList()だけを呼ぶ
  function renderMaster(){
    var html = '<div class="screen-title"><h2>マスタ登録</h2><span class="sub">'+masterList.length+'件</span></div>';
    html += '<div class="master-add">'+
      '<div class="chip-group-label">新しい品目を登録</div>'+
      '<div class="master-row">'+
        '<div class="master-line master-line-item">'+
          iconPickerHtml("new", "📦")+
          '<input type="text" id="newMasterName" placeholder="品目名">'+
          '<select id="newMasterKind">'+
            '<option value="food" selected>食品</option>'+
            '<option value="good">消耗品</option>'+
          '</select>'+
        '</div>'+
        '<div class="master-dup-hint" id="newMasterDupHint" hidden></div>'+
        '<div class="master-line">'+
          '<span class="master-field-label">数量単位:</span>'+
          unitSelectHtml("master-unit", ' id="newMasterUnit"', "点")+
        '</div>'+
        '<div class="master-line" id="newMasterExpiryLine">'+
          '<span class="master-field-label">初期賞味期限日数:</span>'+
          '<input type="number" inputmode="numeric" min="0" max="9999" class="master-days" id="newMasterDays" value="7">'+
          '<span class="master-days-suffix">日</span>'+
          '<label class="master-needs"><input type="checkbox" id="newMasterNeeds" checked>賞味期限あり</label>'+
        '</div>'+
        '<div class="master-line">'+
          '<label class="master-needs"><input type="checkbox" id="newMasterHasSafety">安全在庫:</label>'+
          '<div class="qty-stepper">'+
            '<button type="button" id="newMasterSafetyInc" disabled>+</button>'+
            '<input type="number" inputmode="numeric" class="master-safety-num" id="newMasterSafety" value="0" min="0" step="1" disabled>'+
            '<button type="button" id="newMasterSafetyDec" disabled>−</button>'+
          '</div>'+
        '</div>'+
        '<div class="master-line master-line-actions">'+
          '<button id="addMasterBtn" class="primary-btn">追加</button>'+
        '</div>'+
      '</div></div>';
    html += '<div class="search">🔍<input id="masterSearchInput" placeholder="品目名で検索" value="'+escAttr(masterSearchTerm)+'"></div>';
    html += '<div id="masterListArea"></div>';
    document.getElementById("content").innerHTML = html;

    // 検索欄: #masterListAreaだけを再描画するので、検索欄自体は作り直されずフォーカス・カーソル位置がそのまま保たれる
    var msi = document.getElementById("masterSearchInput");
    if(msi) msi.addEventListener("input", function(e){
      masterSearchTerm = e.target.value;
      masterPage = 0;
      renderMasterList();
    });

    // 新規登録フォームのアイコンピッカー(key="new")。既存行のピッカーはrenderMasterList側で個別に配線する
    var newIconToggle = document.querySelector('.icon-toggle[data-key="new"]');
    if(newIconToggle){
      newIconToggle.addEventListener("click", function(){
        var panel = document.querySelector('.icon-picker[data-key="new"]');
        if(!panel) return;
        var willOpen = panel.hidden;
        document.querySelectorAll(".icon-picker").forEach(function(p){ p.hidden = true; });
        panel.hidden = !willOpen;
      });
    }
    document.querySelectorAll('.icon-choice[data-key="new"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var emoji = btn.getAttribute("data-emoji");
        if(newIconToggle){ newIconToggle.textContent = emoji; newIconToggle.setAttribute("data-emoji", emoji); }
        var panel = document.querySelector('.icon-picker[data-key="new"]');
        if(panel) panel.hidden = true;
      });
    });

    // 似た既存マスタ品目名のヒント: 「冷凍」とだけ打った時点で「冷凍エビ・冷凍パスタ」のように既存品目名を出し、
    // 重複登録に気づけるようにする(この入力欄自体は再描画しないので、フォーカス・カーソル位置には影響しない)
    var newNameInput = document.getElementById("newMasterName");
    var newDupHint = document.getElementById("newMasterDupHint");
    if(newNameInput && newDupHint){
      newNameInput.addEventListener("input", function(){
        var matches = findSimilarMasterNames(newNameInput.value, 5);
        if(matches.length){ newDupHint.hidden = false; newDupHint.textContent = "似た品目名: "+matches.join("・"); }
        else { newDupHint.hidden = true; newDupHint.textContent = ""; }
      });
    }
    // 新規登録フォームの残りの配線
    var newKindSel = document.getElementById("newMasterKind");
    var newNeeds = document.getElementById("newMasterNeeds");
    var newDays = document.getElementById("newMasterDays");
    var newExpiryLine = document.getElementById("newMasterExpiryLine");
    function syncNewFoodFields(){
      var isFood = newKindSel.value === "food";
      if(newExpiryLine) newExpiryLine.style.display = isFood ? "" : "none";
      newDays.disabled = !isFood || !newNeeds.checked;
    }
    newKindSel.addEventListener("change", syncNewFoodFields);
    newNeeds.addEventListener("change", syncNewFoodFields);
    var newHasSafety = document.getElementById("newMasterHasSafety");
    var newSafety = document.getElementById("newMasterSafety");
    var newSafetyDec = document.getElementById("newMasterSafetyDec");
    var newSafetyInc = document.getElementById("newMasterSafetyInc");
    newHasSafety.addEventListener("change", function(){
      newSafety.disabled = !newHasSafety.checked;
      newSafetyDec.disabled = !newHasSafety.checked;
      newSafetyInc.disabled = !newHasSafety.checked;
      if(newHasSafety.checked && !newSafety.value) newSafety.value = 0;
    });
    newSafety.addEventListener("change", function(){
      var v = parseInt(newSafety.value,10);
      newSafety.value = (isNaN(v)||v<0) ? 0 : v;
    });
    newSafetyDec.addEventListener("click", function(){
      newSafety.value = Math.max(0, (parseInt(newSafety.value,10)||0) - 1);
    });
    newSafetyInc.addEventListener("click", function(){
      newSafety.value = (parseInt(newSafety.value,10)||0) + 1;
    });
    document.getElementById("addMasterBtn").addEventListener("click", function(){
      var name = document.getElementById("newMasterName").value.trim();
      if(!name) return;
      var newEmojiBtn = document.querySelector('.icon-toggle[data-key="new"]');
      var emoji = (newEmojiBtn && newEmojiBtn.getAttribute("data-emoji")) || "📦";
      var kind = newKindSel.value;
      var unit = document.getElementById("newMasterUnit").value;
      var needs = newNeeds.checked;
      var days = parseInt(newDays.value, 10);
      if(isNaN(days) || days<0) days = 7;
      var safetyStock = null;
      if(newHasSafety.checked){
        var sv = parseInt(newSafety.value, 10);
        safetyStock = (isNaN(sv) || sv<0) ? 0 : sv;
      }
      var entry = kind==="good"
        ? {name:name, emoji:emoji, kind:"good", unit:unit, safetyStock:safetyStock}
        : {name:name, emoji:emoji, kind:"food", unit:unit, needsExpiry:needs, shelfLifeDays:days, safetyStock:safetyStock};
      var existing = findMaster(name);
      if(existing) Object.assign(existing, entry);
      else masterList.push(entry);
      saveState(); renderMaster();
    });

    renderMasterList();
  }

  // マスタ一覧(検索結果+ページング)だけを再描画する。検索欄の入力・ページ送りのたびにここだけを呼ぶことで、
  // 検索欄そのものは作り直されずフォーカスが保たれる
  function renderMasterList(){
    var area = document.getElementById("masterListArea");
    if(!area) return;

    // 検索で絞り込んだ後も、各行の元のmasterList内でのインデックス(idx)を保持したまま
    // 並び替え・20件ずつのページングを行う(idxはmasterRow内のdata-idx・更新/削除ボタンの対象特定に使われるため、
    // フィルタ・並び替え後の配列上の位置とずれないよう常に元のインデックスを引き回す)
    var filtered = masterList.map(function(m, idx){ return {m:m, idx:idx}; })
      .filter(function(e){ return nameMatchesSearch(e.m.name, masterSearchTerm, e.m.yomi); });
    if(masterSortMode==="kana"){
      filtered = filtered.slice().sort(function(a,b){ return a.m.name.localeCompare(b.m.name,"ja"); });
    }
    var totalPages = Math.max(1, Math.ceil(filtered.length / MASTER_PAGE_SIZE));
    if(masterPage > totalPages-1) masterPage = totalPages-1;
    if(masterPage < 0) masterPage = 0;
    var pageItems = filtered.slice(masterPage*MASTER_PAGE_SIZE, (masterPage+1)*MASTER_PAGE_SIZE);

    var html = '<div class="sort-row"><span>'+filtered.length+'件</span><button id="masterSortToggle">'+(masterSortMode==="kana"?"登録順にする":"あいうえお順にする")+'</button></div>';
    if(!filtered.length) html += '<div class="empty">見つかりませんでした</div>';
    else{
      html += pageItems.map(function(e){ return masterRow(e.m, e.idx); }).join("");
      html += '<div class="master-pagination">'+
        '<button type="button" id="masterPrevPage"'+(masterPage<=0?" disabled":"")+'>← 前へ</button>'+
        '<span>'+(masterPage+1)+' / '+totalPages+'ページ('+filtered.length+'件)</span>'+
        '<button type="button" id="masterNextPage"'+(masterPage>=totalPages-1?" disabled":"")+'>次へ →</button>'+
        '</div>';
    }
    area.innerHTML = html;

    var msTgl = document.getElementById("masterSortToggle");
    if(msTgl) msTgl.addEventListener("click", function(){
      masterSortMode = masterSortMode==="kana" ? "custom" : "kana";
      masterPage = 0;
      renderMasterList();
    });
    var mpPrev = document.getElementById("masterPrevPage");
    if(mpPrev) mpPrev.addEventListener("click", function(){ masterPage--; renderMasterList(); });
    var mpNext = document.getElementById("masterNextPage");
    if(mpNext) mpNext.addEventListener("click", function(){ masterPage++; renderMasterList(); });

    // 既存行: マスタへの反映は即時保存せず、内容が現在のマスタと差分がある間だけ「更新」ボタンを出す
    function masterRowEl(idx){ return document.querySelector('.master-row[data-idx="'+idx+'"]'); }
    function readMasterRowState(idx){
      var row = masterRowEl(idx);
      if(!row) return null;
      var kind = row.querySelector(".master-kind").value;
      var unit = row.querySelector(".master-unit").value;
      var needsCb = row.querySelector(".master-needsexpiry");
      var daysInp = row.querySelector(".master-days");
      var days = parseInt(daysInp.value,10);
      if(isNaN(days) || days<0) days = 7;
      var hasSafetyCb = row.querySelector(".master-hassafety");
      var safetyInp = row.querySelector(".master-safety-num");
      var safetyStock = null;
      if(hasSafetyCb.checked){
        var sv = parseInt(safetyInp.value,10);
        safetyStock = (isNaN(sv)||sv<0) ? 0 : sv;
      }
      var iconBtn = row.querySelector(".icon-toggle");
      return {
        name: row.querySelector(".master-name").value.trim(),
        emoji: iconBtn ? iconBtn.getAttribute("data-emoji") : "📦",
        kind: kind,
        unit: unit,
        needsExpiry: needsCb.checked,
        shelfLifeDays: days,
        safetyStock: safetyStock
      };
    }
    function masterRowIsDirty(idx){
      var m = masterList[idx];
      var live = readMasterRowState(idx);
      if(!m || !live || !live.name) return false;
      if(live.name !== m.name) return true;
      if(live.emoji !== m.emoji) return true;
      if(live.kind !== m.kind) return true;
      if(live.unit !== (m.unit||"点")) return true;
      if(live.kind === "food"){
        if(live.needsExpiry !== (m.needsExpiry!==false)) return true;
        if(live.needsExpiry && live.shelfLifeDays !== (m.shelfLifeDays||7)) return true;
      }
      var mSafety = m.safetyStock==null ? null : m.safetyStock;
      if(live.safetyStock !== mSafety) return true;
      return false;
    }
    function updateRowDirtyUI(idx){
      var btn = document.querySelector('.master-update[data-idx="'+idx+'"]');
      if(btn) btn.hidden = !masterRowIsDirty(idx);
    }
    // 種別セレクト: 切替はまだ確定せず、表示/非表示だけその場で切り替える(全体再描画すると他の未確定入力が消えるため)
    area.querySelectorAll(".master-kind").forEach(function(sel){
      sel.addEventListener("change", function(e){
        var idx = Number(sel.getAttribute("data-idx"));
        var row = masterRowEl(idx);
        var isFood = e.target.value === "food";
        var expiryLine = row.querySelector(".master-line-expiry");
        var needsCb = row.querySelector(".master-needsexpiry");
        var daysInp = row.querySelector(".master-days");
        if(expiryLine) expiryLine.style.display = isFood ? "" : "none";
        if(daysInp) daysInp.disabled = !isFood || !needsCb.checked;
        updateRowDirtyUI(idx);
      });
    });
    area.querySelectorAll(".master-unit[data-idx]").forEach(function(sel){
      sel.addEventListener("change", function(){
        updateRowDirtyUI(Number(sel.getAttribute("data-idx")));
      });
    });
    area.querySelectorAll(".master-needsexpiry").forEach(function(cb){
      cb.addEventListener("change", function(e){
        var idx = Number(cb.getAttribute("data-idx"));
        var daysInput = document.querySelector('.master-days[data-idx="'+idx+'"]');
        if(daysInput) daysInput.disabled = !e.target.checked;
        updateRowDirtyUI(idx);
      });
    });
    // アイコンピッカー(既存行のみ。新規登録フォームのピッカーはrenderMaster側で配線済み):
    // トグルボタンで開閉、選ぶとボタンの見た目だけ差し替えて確定は「更新」ボタンまで待つ
    area.querySelectorAll(".icon-toggle").forEach(function(btn){
      btn.addEventListener("click", function(){
        var key = btn.getAttribute("data-key");
        var panel = document.querySelector('.icon-picker[data-key="'+key+'"]');
        if(!panel) return;
        var willOpen = panel.hidden;
        document.querySelectorAll(".icon-picker").forEach(function(p){ p.hidden = true; });
        panel.hidden = !willOpen;
      });
    });
    area.querySelectorAll(".icon-choice").forEach(function(btn){
      btn.addEventListener("click", function(){
        var key = btn.getAttribute("data-key");
        var emoji = btn.getAttribute("data-emoji");
        var toggleBtn = document.querySelector('.icon-toggle[data-key="'+key+'"]');
        if(toggleBtn){ toggleBtn.textContent = emoji; toggleBtn.setAttribute("data-emoji", emoji); }
        var panel = document.querySelector('.icon-picker[data-key="'+key+'"]');
        if(panel) panel.hidden = true;
        updateRowDirtyUI(Number(key));
      });
    });
    area.querySelectorAll(".master-name").forEach(function(inp){
      inp.addEventListener("input", function(){
        updateRowDirtyUI(Number(inp.getAttribute("data-idx")));
      });
    });
    area.querySelectorAll(".master-days[data-idx]").forEach(function(inp){
      inp.addEventListener("input", function(){
        updateRowDirtyUI(Number(inp.getAttribute("data-idx")));
      });
    });
    area.querySelectorAll(".master-hassafety").forEach(function(cb){
      cb.addEventListener("change", function(e){
        var idx = Number(cb.getAttribute("data-idx"));
        var safetyInput = document.querySelector('.master-safety-num[data-idx="'+idx+'"]');
        var decBtn = document.querySelector('.master-safety-dec[data-idx="'+idx+'"]');
        var incBtn = document.querySelector('.master-safety-inc[data-idx="'+idx+'"]');
        if(e.target.checked){
          if(safetyInput){ safetyInput.disabled = false; if(!safetyInput.value) safetyInput.value = 0; }
          if(decBtn) decBtn.disabled = false;
          if(incBtn) incBtn.disabled = false;
        } else {
          if(safetyInput) safetyInput.disabled = true;
          if(decBtn) decBtn.disabled = true;
          if(incBtn) incBtn.disabled = true;
        }
        updateRowDirtyUI(idx);
      });
    });
    area.querySelectorAll(".master-safety-num").forEach(function(inp){
      inp.addEventListener("input", function(){
        var idx = Number(inp.getAttribute("data-idx"));
        updateRowDirtyUI(idx);
      });
      inp.addEventListener("change", function(){
        var v = parseInt(inp.value,10);
        inp.value = (isNaN(v)||v<0) ? 0 : v;
        updateRowDirtyUI(Number(inp.getAttribute("data-idx")));
      });
    });
    area.querySelectorAll(".master-safety-dec").forEach(function(btn){
      btn.addEventListener("click", function(){
        var idx = Number(btn.getAttribute("data-idx"));
        var inp = document.querySelector('.master-safety-num[data-idx="'+idx+'"]');
        inp.value = Math.max(0, (parseInt(inp.value,10)||0) - 1);
        updateRowDirtyUI(idx);
      });
    });
    area.querySelectorAll(".master-safety-inc").forEach(function(btn){
      btn.addEventListener("click", function(){
        var idx = Number(btn.getAttribute("data-idx"));
        var inp = document.querySelector('.master-safety-num[data-idx="'+idx+'"]');
        inp.value = (parseInt(inp.value,10)||0) + 1;
        updateRowDirtyUI(idx);
      });
    });
    // 更新ボタン: ここで初めてマスタに反映・保存する
    area.querySelectorAll(".master-update").forEach(function(btn){
      btn.addEventListener("click", function(){
        var idx = Number(btn.getAttribute("data-idx"));
        var live = readMasterRowState(idx);
        if(!live || !live.name) return;
        var m = masterList[idx];
        var oldName = m.name;
        m.name = live.name;
        m.emoji = live.emoji;
        m.kind = live.kind;
        m.unit = live.unit;
        if(live.kind === "food"){
          m.needsExpiry = live.needsExpiry;
          m.shelfLifeDays = live.shelfLifeDays;
        }
        m.safetyStock = live.safetyStock;
        propagateMasterChange(oldName, m);
        currentRecipes = pickRecipes();
        saveState(); renderMaster();
      });
    });
    area.querySelectorAll(".master-del").forEach(function(btn){
      btn.addEventListener("click", function(){
        masterList.splice(Number(btn.getAttribute("data-idx")), 1);
        saveState(); renderMaster();
      });
    });
  }

  var RENDER = { inventory:renderInventory, shopping:renderShopping, voice:renderVoice, recipe:renderRecipe, master:renderMaster, family:renderFamily };

  function switchTab(tab){
    if(activeTab==="voice" && tab!=="voice" && recognition && listening){ recognition.stop(); }
    activeTab = tab;
    document.querySelectorAll(".tab").forEach(function(t){ t.setAttribute("aria-selected", t.getAttribute("data-tab")===tab ? "true":"false"); });
    RENDER[tab]();
  }
  document.querySelectorAll(".tab").forEach(function(t){
    t.addEventListener("click", function(){
      if(t.classList.contains("disabled")) return;
      // 確認カード/分割編集カードが出ている間は他のタブに移動できない(登録/キャンセルを選ぶまでブロック)
      if((pendingConfirm || pendingSplit) && t.getAttribute("data-tab") !== activeTab) return;
      switchTab(t.getAttribute("data-tab"));
    });
  });

  document.getElementById("resetBtn").addEventListener("click", function(){
    if(!confirm("サンプルデータに戻す?入力した内容は消えるよ")) return;
    var d = defaultData();
    uid=d.uid; inventory=d.inventory; shopping=d.shopping; chatLog=d.chatLog; pendingConfirm=d.pendingConfirm; pendingSplit=d.pendingSplit; recoDismissed=d.recoDismissed;
    currentRecipes = pickRecipes();
    saveState();
    switchTab(activeTab);
  });

  var infoDismissed = loadFlag("shaberu-reizoko-info-dismissed", false);
  if(infoDismissed) document.getElementById("infobox").style.display = "none";
  document.getElementById("infoClose").addEventListener("click", function(){
    document.getElementById("infobox").style.display = "none";
    saveFlag("shaberu-reizoko-info-dismissed", true);
  });

  document.getElementById("todayLabel").textContent = (today.getMonth()+1)+"月"+today.getDate()+"日("+WD[today.getDay()]+")";

  switchTab(pendingConfirm ? "voice" : "inventory");
})();
</script>

</body></html>
