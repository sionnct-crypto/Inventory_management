<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>たなおろしさん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #eef2ec;
    --surface: #ffffff;
    --surface-2: #f7f9f4;
    --ink: #1b2a2c;
    --ink-muted: #5c6d69;
    --accent: #dd6127;
    --accent-ink: #fffaf5;
    --good: #3f8f5f;
    --good-bg: #e4f2e8;
    --warn: #b8791c;
    --warn-bg: #faedd4;
    --danger: #b6402f;
    --danger-bg: #f6e0dc;
    --line: #dde3d8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #101a1b; --surface:#172224; --surface-2:#1c2a2b;
      --ink:#edf1ea; --ink-muted:#9db0ac; --accent:#f1793d; --accent-ink:#1b1008;
      --good:#63bd85; --good-bg:#17331f; --warn:#e7b355; --warn-bg:#3a2c11;
      --danger:#e2695c; --danger-bg:#3a1c17; --line:#2a3a3b;
    }
  }
  :root[data-theme="dark"]{
    --bg: #101a1b; --surface:#172224; --surface-2:#1c2a2b;
    --ink:#edf1ea; --ink-muted:#9db0ac; --accent:#f1793d; --accent-ink:#1b1008;
    --good:#63bd85; --good-bg:#17331f; --warn:#e7b355; --warn-bg:#3a2c11;
    --danger:#e2695c; --danger-bg:#3a1c17; --line:#2a3a3b;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
    min-height:100vh;
  }
  h1,h2,h3,.display{ font-family:"Noto Serif JP","Hiragino Mincho ProN",serif; text-wrap:balance; margin:0; }
  .num{ font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }

  .app{
    max-width: 480px;
    margin:0 auto;
    width:100%;
    flex:1;
    display:flex; flex-direction:column;
    min-height:100vh;
    background:var(--surface-2);
  }

  .topbar{
    padding: max(14px, env(safe-area-inset-top)) 16px 10px;
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--line);
    background:var(--surface);
  }
  .topbar h1{ font-size:18px; }
  .topbar .today{ font-size:11px; color:var(--ink-muted); }
  .topbar .reset{ background:none;border:none;color:var(--ink-muted);font-size:11px;text-decoration:underline;cursor:pointer;padding:0; }

  .infobox{
    margin:12px 16px 0; background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; font-size:12px; line-height:1.7; color:var(--ink-muted); position:relative;
  }
  .infobox b{ color:var(--ink); }
  .infobox .close{ position:absolute; top:8px; right:10px; background:none; border:none; color:var(--ink-muted); font-size:14px; cursor:pointer; }

  .content{ flex:1; overflow-y:auto; padding: 14px 16px 24px; display:flex; flex-direction:column; gap:12px; }

  .screen-title{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:2px; }
  .screen-title h2{ font-size:19px; }
  .screen-title .sub{ font-size:11.5px; color:var(--ink-muted); }

  .search{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .search input{ border:none; outline:none; background:none; color:var(--ink); font:inherit; font-size:14px; width:100%; }

  .sort-row{ display:flex; align-items:center; justify-content:space-between; font-size:11.5px; color:var(--ink-muted); }
  .sort-row button{ font:inherit; font-size:11.5px; font-weight:700; color:var(--accent); background:none; border:none; cursor:pointer; padding:0; }

  .master-pagination{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:2px; }
  .master-pagination span{ font-size:11.5px; color:var(--ink-muted); }
  .master-pagination button{ font:inherit; font-size:11.5px; font-weight:700; color:var(--accent); background:none; border:none; cursor:pointer; padding:4px 6px; }
  .master-pagination button:disabled{ color:var(--ink-muted); opacity:.5; cursor:default; }

  .item-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:13px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; row-gap:8px; }
  .item-tap{ display:flex; align-items:center; gap:10px; flex:1; min-width:0; background:none; border:none; padding:0; margin:0; font:inherit; text-align:left; color:inherit; cursor:pointer; }
  .item-date-edit{ font:inherit; font-size:12px; border:1px solid var(--line); border-radius:8px; padding:5px 7px; background:var(--surface-2); color:var(--ink); }
  .item-qty-unit-label{ font-size:12.5px; font-weight:600; color:var(--ink-muted); }
  .split-row{ background:var(--surface-2); border-radius:10px; padding:8px 9px; flex-wrap:nowrap; overflow-x:auto; }
  .split-row .qty-stepper{ flex:none; }
  .split-row .item-qty-unit-label{ flex:none; }
  .split-row .item-date-edit{ margin-left:auto; flex:none; width:126px; }
  .split-row .pill{ margin-left:auto; }
  .split-row-remove{ font:inherit; font-size:12px; font-weight:700; width:26px; height:26px; flex:none; border-radius:8px; border:1px solid var(--line); background:var(--surface-2); color:var(--danger); cursor:pointer; }
  .split-warn{ font-size:12px; color:var(--warn); background:var(--warn-bg); border:1px solid color-mix(in srgb, var(--warn) 45%, transparent); border-radius:10px; padding:8px 10px; line-height:1.5; }
  .kind-toggle{ display:flex; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:3px; }
  .summary-total{ font-size:12.5px; font-weight:700; color:var(--ink); flex:none; white-space:nowrap; }
  .kind-tab{ flex:1; font:inherit; font-size:12.5px; font-weight:700; padding:7px 10px; border-radius:999px; border:none; background:none; color:var(--ink-muted); cursor:pointer; }
  .kind-tab.active{ background:var(--accent); color:var(--accent-ink); }
  .item-emoji{ font-size:23px; width:30px; text-align:center; flex:none; }
  .item-main{ flex:1; min-width:0; }
  .item-name{ font-size:14px; font-weight:700; }
  .item-meta{ font-size:12px; color:var(--ink-muted); margin-top:2px; }
  .item-reg{ opacity:.8; display:inline-block; margin-top:2px; }
  .pill{ font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; flex:none; white-space:nowrap; }
  .consume-btn{ font:inherit; font-size:11px; font-weight:700; padding:6px 11px; border-radius:999px; cursor:pointer; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-muted); flex:none; }
  .consume-btn:active{ border-color:var(--accent); color:var(--accent); }
  .pill.good{ color:var(--good); background:var(--good-bg); }
  .pill.warn{ color:var(--warn); background:var(--warn-bg); }
  .pill.danger{ color:var(--danger); background:var(--danger-bg); }
  .pill.noexp{ color:var(--ink-muted); background:var(--surface-2); }

  .banner{ background:var(--warn-bg); border:1px solid color-mix(in srgb, var(--warn) 45%, transparent); color:var(--ink); border-radius:14px; padding:12px 14px; font-size:12.5px; display:flex; align-items:flex-start; gap:8px; line-height:1.55; }
  .banner b{ display:block; font-size:13px; margin-bottom:2px; }
  .banner .go{ margin-left:auto; flex:none; background:none; border:none; color:var(--warn); font:inherit; font-weight:700; font-size:11.5px; cursor:pointer; text-decoration:underline; white-space:nowrap; }

  .reco{ background:var(--surface); border:1px dashed color-mix(in srgb, var(--accent) 50%, var(--line)); border-radius:14px; padding:12px 14px; font-size:12.5px; color:var(--ink-muted); display:flex; align-items:center; gap:10px; }
  .reco b{ color:var(--ink); }
  .reco button{ margin-left:auto; flex:none; font:inherit; font-size:11.5px; font-weight:700; background:var(--accent); color:var(--accent-ink); border:none; border-radius:999px; padding:7px 13px; cursor:pointer; }

  .shop-row{ display:flex; align-items:center; gap:11px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
  .check{ width:22px;height:22px;border-radius:7px;border:2px solid var(--line); flex:none; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--accent-ink); background:var(--surface); font-size:13px; }
  .check.done{ background:var(--good); border-color:var(--good); }
  .shop-name{ font-size:14px; font-weight:600; flex:1; }
  .shop-name.done{ text-decoration:line-through; color:var(--ink-muted); }

  .empty{ text-align:center; color:var(--ink-muted); font-size:12.5px; padding:28px 8px; }

  .compose{ display:flex; gap:6px; align-items:center; }
  .compose input{
    flex:1; border:1px solid var(--line); background:var(--surface); border-radius:11px;
    padding:8px 11px; font:inherit; font-size:13.5px; color:var(--ink); outline:none;
  }
  .compose input:focus{ border-color:var(--accent); }
  .compose button{ background:var(--accent); color:var(--accent-ink); border:none; border-radius:11px; padding:0 14px; height:36px; font-weight:700; font-size:12.5px; cursor:pointer; flex:none; }
  .compose button:disabled{ opacity:.4; }

  .voice-hint{ font-size:11.5px; color:var(--ink-muted); line-height:1.6; }
  .voice-hint .kbd{ font-family:"JetBrains Mono",monospace; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:1px 6px; }

  .speak-toggle{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-muted); }
  .speak-toggle input{ accent-color:var(--accent); }

  .mic-zone{ display:flex; flex-direction:column; align-items:center; gap:10px; padding: 6px 0 2px; }
  .mic-btn{
    width:76px;height:76px;border-radius:50%; border:none; cursor:pointer;
    background:var(--accent); color:var(--accent-ink); font-size:28px;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent);
  }
  .mic-btn.listening{ animation: pulse 1.1s ease-out infinite; background:var(--danger); }
  .mic-btn:disabled{ opacity:.35; cursor:default; }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 color-mix(in srgb, var(--danger) 55%, transparent); }
    100%{ box-shadow: 0 0 0 26px color-mix(in srgb, var(--danger) 0%, transparent); }
  }
  .mic-caption{ font-size:12px; color:var(--ink-muted); text-align:center; min-height:16px; }
  .mic-caption b{ color:var(--ink); }
  .divider-or{ display:flex; align-items:center; gap:10px; color:var(--ink-muted); font-size:11px; margin:2px 0; }
  .divider-or::before, .divider-or::after{ content:""; flex:1; height:1px; background:var(--line); }

  .chip-group-label{ font-size:11.5px; font-weight:700; color:var(--ink-muted); margin-top:2px; }
  .chips{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{ font:inherit; font-size:12.5px; font-weight:600; background:var(--surface); border:1px solid var(--line); color:var(--ink); border-radius:999px; padding:8px 13px; cursor:pointer; }
  .chip:active{ border-color:var(--accent); color:var(--accent); }
  .chip-group-label{ display:flex; align-items:center; gap:8px; }
  .chip-edit-toggle{ font:inherit; font-size:11px; font-weight:700; color:var(--accent); background:none; border:none; cursor:pointer; padding:0; }
  .chip-editable{ display:flex; align-items:center; gap:6px; cursor:default; }
  .chip-editable .chip-text{ cursor:default; }
  .chip-remove{ font:inherit; font-size:11px; font-weight:700; width:18px; height:18px; flex:none; border-radius:50%; border:none; background:var(--danger-bg); color:var(--danger); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }

  .bubble-log{ display:flex; flex-direction:column; gap:5px; min-height:auto; }
  .bubble-row{ min-height:auto; }
  .bubble-row.user{ text-align:right; }
  .bubble-row.app{ text-align:left; }
  .bubble{ display:inline-block; text-align:left; max-width:82%; min-height:0; padding:6px 9px; border-radius:10px; font-size:11.5px; line-height:1.45; }
  .bubble.user{ background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:3px; }
  .bubble.app{ background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:3px; }
  .bubble .tag{ display:block; font-size:9px; opacity:.7; margin-top:2px; }
  .confirm-card{ background:var(--surface); border:1px solid var(--accent); border-radius:14px; padding:13px 14px; display:flex; flex-direction:column; gap:10px; }
  .confirm-card .title{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; }
  .badge{ font-size:10.5px; font-weight:700; background:var(--accent); color:var(--accent-ink); padding:2px 9px; border-radius:999px; flex:none; }
  .confirm-list{ display:flex; flex-direction:column; gap:7px; }
  .confirm-row{ display:flex; align-items:center; gap:9px; font-size:13px; flex-wrap:wrap; row-gap:5px; }
  .confirm-row .item-emoji{ font-size:17px; width:20px; text-align:center; flex:none; }
  .confirm-row .nm{ flex:1; font-weight:600; min-width:40px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .confirm-row .qt{ color:var(--ink-muted); font-size:12px; flex:none; }
  .confirm-row .ex{ color:var(--ink-muted); font-size:12px; flex:none; white-space:nowrap; }
  .confirm-name{ flex:1; min-width:64px; font:inherit; font-size:13px; font-weight:600; border:1px solid var(--line); border-radius:8px; padding:5px 8px; background:var(--surface-2); color:var(--ink); }
  .confirm-date{ font:inherit; font-size:12px; border:1px solid var(--line); border-radius:8px; padding:5px 7px; background:var(--surface-2); color:var(--ink); flex:none; }
  .confirm-sub{ font-size:11.5px; color:var(--ink-muted); margin:-3px 0 0 29px; }
  .confirm-dup-hint{ font-size:11.5px; color:var(--warn); background:var(--warn-bg); border-radius:8px; padding:5px 9px; margin:-2px 0 0 29px; }
  .confirm-candidates{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 0 29px; }
  .cand-chip{ font:inherit; font-size:11.5px; font-weight:600; background:var(--surface-2); border:1px solid var(--line); color:var(--ink); border-radius:12px; padding:5px 10px; cursor:pointer; display:flex; flex-direction:column; align-items:flex-start; line-height:1.35; }
  .cand-chip span{ font-size:10px; color:var(--ink-muted); font-weight:500; }
  .cand-chip.selected{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--surface-2)); color:var(--accent); }
  .cand-chip.selected span{ color:var(--accent); }
  .confirm-shop-toggle{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-muted); margin:0 0 0 29px; }
  .confirm-shop-toggle input{ accent-color:var(--accent); }
  .confirm-kind-tag{ font-size:11px; font-weight:700; color:var(--ink-muted); background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:3px 10px; flex:none; }
  .confirm-item-kind{ font:inherit; font-size:12px; border:1px solid var(--line); border-radius:8px; padding:5px 7px; background:var(--surface-2); color:var(--ink); flex:none; }
  .confirm-qty-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:0 0 0 29px; }
  .qty-stepper{ display:flex; align-items:center; gap:4px; }
  .qty-stepper button{ width:26px; height:26px; flex:none; border-radius:8px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); font:inherit; font-size:14px; font-weight:700; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .qty-stepper button:active{ border-color:var(--accent); color:var(--accent); }
  .confirm-safety-num{ width:70px; font:inherit; font-size:13px; font-weight:600; border:1px solid var(--line); border-radius:8px; padding:5px 7px; background:var(--surface-2); color:var(--ink); }
  .confirm-qty-num, .split-qty-num{ width:44px; text-align:center; font:inherit; font-size:13px; font-weight:600; border:1px solid var(--line); border-radius:8px; padding:5px 4px; background:var(--surface-2); color:var(--ink); }
  .confirm-qty-unit{ font:inherit; font-size:12px; border:1px solid var(--line); border-radius:8px; padding:5px 6px; background:var(--surface-2); color:var(--ink); flex:none; }
  .master-status{ font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:999px; margin:0 0 0 29px; align-self:flex-start; display:inline-flex; align-items:center; gap:5px; }
  .master-status.known{ color:var(--good); background:var(--good-bg); }
  .master-status.unknown{ color:var(--warn); background:var(--warn-bg); cursor:pointer; }
  .master-status.unknown input{ accent-color:var(--warn); }
  .confirm-actions{ display:flex; gap:8px; justify-content:flex-end; }
  .confirm-actions button{ font:inherit; font-size:12.5px; font-weight:700; padding:7px 15px; border-radius:999px; cursor:pointer; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); }
  .confirm-actions button.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

  .master-add{ background:var(--surface); border:1px dashed color-mix(in srgb, var(--accent) 50%, var(--line)); border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
  .master-row{ display:flex; flex-direction:column; align-items:stretch; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .master-add .master-row{ border:none; padding:0; background:none; }
  .master-line{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; row-gap:6px; }
  .master-line-actions{ justify-content:flex-end; }
  .icon-field{ position:relative; flex:none; }
  .icon-toggle{ width:44px; height:38px; font-size:18px; text-align:center; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink); cursor:pointer; }
  .icon-picker{ position:absolute; z-index:5; top:calc(100% + 4px); left:0; width:220px; max-height:180px; overflow-y:auto; display:flex; flex-wrap:wrap; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px; box-shadow:0 6px 18px rgba(0,0,0,.18); }
  .icon-choice{ font-size:18px; width:32px; height:32px; flex:none; border:1px solid transparent; border-radius:8px; background:none; cursor:pointer; }
  .icon-choice:active{ background:var(--surface-2); border-color:var(--line); }
  .master-name{ flex:1; min-width:70px; font:inherit; font-size:13px; font-weight:600; border:1px solid var(--line); border-radius:8px; padding:6px 9px; background:var(--surface-2); color:var(--ink); }
  .master-kind{ font:inherit; font-size:12px; border:1px solid var(--line); border-radius:8px; padding:6px 7px; background:var(--surface-2); color:var(--ink); flex:none; }
  .master-unit{ font:inherit; font-size:12px; border:1px solid var(--line); border-radius:8px; padding:6px 7px; background:var(--surface-2); color:var(--ink); flex:none; }
  .master-needs{ display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-muted); flex:none; white-space:nowrap; }
  .master-field-label{ font-size:11.5px; color:var(--ink-muted); flex:none; white-space:nowrap; }
  .master-dup-hint{ font-size:11.5px; color:var(--warn); background:var(--warn-bg); border-radius:8px; padding:5px 9px; }
  .master-needs input{ accent-color:var(--accent); }
  .master-days{ width:48px; flex:none; font:inherit; font-size:12px; border:1px solid var(--line); border-radius:8px; padding:6px 7px; background:var(--surface-2); color:var(--ink); }
  .master-days-suffix{ font-size:11.5px; color:var(--ink-muted); flex:none; }
  .master-safety-num{ width:40px; text-align:center; font:inherit; font-size:12px; font-weight:600; border:1px solid var(--line); border-radius:8px; padding:6px 4px; background:var(--surface-2); color:var(--ink); }
  .master-update{ font:inherit; font-size:11px; font-weight:700; padding:6px 12px; border-radius:999px; cursor:pointer; border:none; background:var(--accent); color:var(--accent-ink); flex:none; }
  .master-del{ font:inherit; font-size:11px; font-weight:700; padding:6px 11px; border-radius:999px; cursor:pointer; border:1px solid var(--line); background:var(--surface-2); color:var(--danger); flex:none; }
  .primary-btn{ font:inherit; font-size:12.5px; font-weight:700; padding:7px 15px; border-radius:999px; cursor:pointer; border:none; background:var(--accent); color:var(--accent-ink); flex:none; }

  .recipe-card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; }
  .recipe-card+.recipe-card{ margin-top:10px; }
